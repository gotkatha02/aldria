<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Build a Golem V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1220;--bg2:#121a2e;--panel:#17213a;--panel2:#1d2a48;--line:#2b3b62;--text:#e9effc;--muted:#8fa2c8;
  --cyan:#3fe0ff;--gold:#ffc94a;--red:#ff5d6c;--green:#52e08a;
  --r0:#9aa3b2;--r1:#4cd964;--r2:#3f8cff;--r3:#b05cff;--r4:#ffc23d;--r5:#ff4f8b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#1b2b52 0%,var(--bg) 60%)}
/* topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,15,28,.85);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:1px;font-size:18px;background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
.res{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-weight:600;font-size:14px;min-width:70px;justify-content:center}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:38px;height:34px;padding:0 9px;font-size:15px}
.ibtn:hover{border-color:var(--cyan)}
.dbg-btn{background:#5a1830;border-color:#ff4f8b;color:#ffd0df;font-weight:700;font-size:12px}
/* workshop */
.screen{flex:1;min-height:0}
#workshop{overflow:auto}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1400px;margin:0 auto}
.stage{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:10px;align-items:center;background:linear-gradient(180deg,#16223e,#111a30);border:1px solid var(--line);border-radius:18px;padding:12px;position:relative}
.cv-wrap{position:relative;height:430px;min-width:0}
#wcv{width:100%;height:100%;display:block}
.stage-tag{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(0,0,0,.3);padding:2px 10px;border-radius:10px;white-space:nowrap}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:left;min-height:68px;transition:transform .1s,border-color .2s}
.slot:hover{transform:translateY(-2px)}
.slot img,.slot .noimg{width:50px;height:50px;border-radius:10px;background:#0e1527;flex-shrink:0}
.slot .noimg{display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.5}
.slot .sl-l{font-size:11px;color:var(--muted)}
.slot .sl-n{font-size:13px;font-weight:600;line-height:1.15}
.slot .sl-v{font-size:11px;color:var(--muted)}
.navbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.nbtn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center}
.nbtn .e{font-size:22px}
.nbtn:hover{border-color:var(--cyan);background:#22335a}
.nbtn.main{background:linear-gradient(180deg,#ffd35e,#e09a1c);color:#2a1700;border-color:#ffe08a}
.nbtn .badge{background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 6px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--cyan);display:flex;align-items:center;gap:6px}
.stat{margin-bottom:8px}
.stat .row{display:flex;justify-content:space-between;font-size:14px}
.stat .row b{font-size:17px}
.bar{height:7px;background:#0d1426;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:5px}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.skrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;font-size:13px}
.skrow .ic{width:32px;height:32px;border-radius:9px;background:#0e1527;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;background:#101831;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:13px}
.tab.on{background:var(--panel2);border-color:var(--cyan);color:var(--cyan)}
.quest{background:#111a31;border:1px solid var(--line);border-radius:11px;padding:8px;margin-bottom:7px;font-size:13px}
.quest .qt{display:flex;justify-content:space-between;gap:6px;align-items:center}
.quest .rw{font-size:11px;color:var(--gold);white-space:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#3fe0ff,#1e9ec4);color:#03202b;border-color:#8ff0ff}
.btn.gold{background:linear-gradient(180deg,#ffd35e,#e09a1c);color:#2a1700;border-color:#ffe08a}
.btn.red{background:#4a1622;border-color:#ff5d6c;color:#ffd0d6}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px;border-radius:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px;backdrop-filter:blur(3px)}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(940px,100%);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .18s ease-out}
.mbox.narrow{width:min(520px,100%)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.mhead h2{margin:0;font-size:18px;flex:1}
.mbody{padding:14px;overflow:auto;min-height:0}
.x{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:16px}
#confirm{z-index:80}
/* part cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:13px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;font-size:12px}
.pc:hover{transform:translateY(-2px)}
.pc .top{display:flex;gap:7px;align-items:center}
.pc img{width:48px;height:48px;border-radius:9px;background:#0e1527;flex-shrink:0}
.pc .nm{font-weight:600;font-size:13px;line-height:1.15}
.pc .rr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pc .eq{position:absolute;top:5px;right:6px;font-size:10px;background:var(--cyan);color:#012;border-radius:6px;padding:0 5px;font-weight:700}
.pc .cnt{position:absolute;bottom:5px;right:7px;font-size:10px;color:var(--muted)}
.sline{color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-family:inherit;font-size:13px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;background:#0f1730;border-radius:10px;padding:8px 10px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list .li{display:flex;gap:9px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 9px;margin-bottom:7px}
.list .li img{width:52px;height:52px;border-radius:9px;background:#0e1527;flex-shrink:0}
.list .li .mid{flex:1;min-width:0;font-size:12px}
.list .li .acts{display:flex;flex-direction:column;gap:5px}
.detail{display:grid;grid-template-columns:160px 1fr;gap:14px}
.detail img{width:160px;height:160px;border-radius:16px;background:#0e1527}
.tag{display:inline-block;font-size:11px;border-radius:7px;padding:1px 7px;background:#0f1730;border:1px solid var(--line);margin-right:4px}
/* summon */
.forge{display:flex;flex-direction:column;align-items:center;gap:10px}
#scv{width:min(420px,100%);height:220px;border-radius:14px;background:#0a0f1d}
.sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.sres .pc{animation:rev .35s ease-out both}
@keyframes rev{from{transform:translateY(12px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.pity{font-size:12px;color:var(--muted);text-align:center}
.guar{font-size:9px;background:var(--gold);color:#2a1700;border-radius:5px;padding:0 4px;font-weight:700}
/* dungeon select */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcard{border-radius:16px;padding:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px;min-height:250px}
.dcard h4{margin:0;font-size:17px}
.dcard .ores{display:flex;flex-wrap:wrap;gap:4px}
.dcard .sp{flex:1}
/* dungeon */
#dungeon{position:fixed;inset:0;z-index:20;background:#05070d}
#dcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;align-items:center;flex-wrap:wrap;pointer-events:none;background:linear-gradient(180deg,rgba(5,8,16,.9),rgba(5,8,16,.55));border-bottom:1px solid rgba(80,110,170,.25)}
.hud-top>*{pointer-events:auto}
.hp{background:rgba(20,30,55,.9);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.hp.timer{font-size:17px;color:var(--gold);min-width:78px;text-align:center}
.hp.timer.low{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.bagw{display:flex;align-items:center;gap:6px;background:rgba(20,30,55,.9);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600}
.bagw .bar{width:110px;margin:0;height:9px}
.dname{font-weight:700;color:var(--cyan);font-size:14px;margin-right:auto}
.hud-bot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(5,8,16,.92),rgba(5,8,16,.5));border-top:1px solid rgba(80,110,170,.25)}
.hud-l{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:rgba(25,38,68,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px;min-height:46px;min-width:84px}
.hbtn.on{border-color:var(--green);color:var(--green)}
.hbtn.ext{background:linear-gradient(180deg,#ffd35e,#e09a1c);color:#2a1700;border-color:#ffe08a}
.hbtn.ext.pulse{animation:pulse .8s infinite}
.hbtn.ext.going{background:#3b2e10;color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,201,74,.35)}}
.hud-s{display:flex;gap:8px}
.skill{position:relative;width:76px;height:76px;border-radius:18px;background:rgba(25,38,68,.95);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:2px}
.skill .ic{font-size:26px;line-height:1}
.skill .nm{font-size:9.5px;line-height:1.05;text-align:center;margin-top:2px}
.skill .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1turn),transparent 0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.skill kbd{position:absolute;top:2px;left:5px;font-size:10px;color:var(--muted);font-family:inherit}
.skill.ready{border-color:var(--cyan);box-shadow:0 0 12px rgba(63,224,255,.35)}
.skill.none{opacity:.35}
.dbgbar{position:absolute;right:8px;top:62px;display:flex;flex-direction:column;gap:4px}
/* toast */
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(16,24,44,.96);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .2s ease-out;text-align:center}
.toast.err{border-color:var(--red);color:#ffc4cb}.toast.ok{border-color:var(--green)}.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.result-big{font-size:34px;font-weight:800;color:var(--gold);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td:last-child,table.t th:last-child{text-align:right}
.preset{display:flex;flex-direction:column;gap:7px}
.preset input{background:#0f1730;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:7px 9px;font-family:inherit;font-size:14px;width:100%}
.picons{display:flex;gap:4px;flex-wrap:wrap}
.picons img{width:36px;height:36px;border-radius:7px;background:#0e1527}
.picons .miss{width:36px;height:36px;border-radius:7px;background:#3a1220;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red)}
@media (max-width:1100px){.ws{grid-template-columns:1fr}}
@media (max-width:760px){
  .ws{padding:8px;gap:10px}
  .stage{grid-template-columns:1fr 1fr;grid-template-areas:"cv cv" "l r";padding:8px}
  .cv-wrap{grid-area:cv;height:300px}
  .slots.left{grid-area:l}.slots.right{grid-area:r}
  .slot{min-height:58px;padding:5px 6px;gap:6px}
  .slot img,.slot .noimg{width:42px;height:42px}
  .slot .sl-n{font-size:12px}
  .dgrid{grid-template-columns:1fr}
  .dcard{min-height:0}
  .detail{grid-template-columns:1fr}
  .detail img{width:120px;height:120px}
  .logo{font-size:15px;width:100%;text-align:center}
  .res{min-width:0;font-size:13px;padding:3px 9px}
  .skill{width:66px;height:66px}
  .hbtn{min-width:0;padding:6px 9px;font-size:12px;min-height:42px}
  .hp{font-size:12px;padding:3px 7px}.hp.timer{font-size:15px;min-width:64px}
  .bagw .bar{width:60px}
  .dname{width:100%;font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .list .li{flex-wrap:wrap}
  .list .li img{width:44px;height:44px}
  .list .li .mid{flex:1 1 calc(100% - 60px)}
  .list .li .acts{flex-direction:row;width:100%;justify-content:flex-end}
  .cmp{font-size:12px}
  .mbody{padding:10px}
}
/* ===== V2 ===== */
.res.sm{min-width:0;font-size:13px;padding:4px 9px}
.navgrp{margin-top:10px}.ngl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin:0 0 5px 4px}
.nbtn .hint{font-size:10px}
.bd{margin-top:4px;border-top:1px dashed var(--line);padding-top:6px}.bdrow{font-size:11.5px;color:var(--muted);margin-bottom:2px}.bdrow b{color:var(--text)}
.synrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;font-size:12.5px;background:#111a31;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.synrow .ic{width:30px;height:30px;border-radius:9px;background:#0e1527;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;border:1px solid}
#synBan{position:fixed;left:50%;top:16%;transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;z-index:120;transition:all .35s cubic-bezier(.2,1.4,.4,1);width:max-content;max-width:92vw}
#synBan.show{opacity:1;transform:translate(-50%,0) scale(1)}
.sbx{background:radial-gradient(ellipse at 50% 0%,#3a2a6a,#121a2e 70%);border:2px solid #ff9df0;border-radius:18px;padding:16px 22px;text-align:center;box-shadow:0 0 40px rgba(255,157,240,.45),0 20px 60px rgba(0,0,0,.6)}
.sbt{font-weight:800;font-size:20px;letter-spacing:2px;background:linear-gradient(90deg,#3fe0ff,#ff9df0,#ffc94a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:sbg .9s ease-in-out infinite alternate}
@keyframes sbg{to{filter:brightness(1.6)}}
.sbn{font-size:22px;font-weight:800;margin-top:6px}.sbd{font-size:13px;color:var(--muted);max-width:420px;margin:0 auto}.sbr{font-size:12px;color:var(--gold);margin-top:8px}
.cdxprog{margin-bottom:10px}.cdxprog .bar{height:9px}.cdxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}
.cdx{display:flex;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:9px;font-size:13px}
.cdx.lock{opacity:.8;border-style:dashed}.cdxi{width:58px;height:58px;flex-shrink:0;border-radius:14px;background:#0e1527;display:flex;align-items:center;justify-content:center;font-size:30px}
.cdx.lock .cdxi{filter:grayscale(1) brightness(0) drop-shadow(0 0 2px #556)}
.cdx:not(.lock) .cdxi{animation:cdxg 2.4s ease-in-out infinite}@keyframes cdxg{50%{transform:scale(1.08) rotate(4deg);filter:brightness(1.3)}}
.cdxp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:5px 0}.tag img{width:18px;height:18px;vertical-align:middle;margin-right:3px;border-radius:4px}
.evob{margin-top:10px;padding:10px}.evocmp{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}.evocmp>div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);gap:3px}
.evocmp img{width:96px!important;height:96px!important;border-radius:12px;background:#0e1527}.evoaf img{box-shadow:0 0 18px rgba(255,201,74,.45);animation:evop 1.6s ease-in-out infinite}
@keyframes evop{50%{box-shadow:0 0 32px rgba(255,201,74,.8)}}.evoar{font-size:26px;color:var(--gold)}
.evobr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.evobr .btn{text-align:left;line-height:1.3;font-weight:500}.evobr .btn span{font-size:11px;opacity:.85}.evomat{margin:6px 0;font-size:13px}
.mbox.evoflash{animation:evof .8s ease-out}@keyframes evof{0%{box-shadow:0 0 0 0 rgba(255,216,74,.9)}40%{box-shadow:0 0 60px 20px rgba(255,216,74,.6)}100%{box-shadow:0 20px 60px rgba(0,0,0,.6)}}
.rtree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rcol h4{margin:0 0 8px;text-align:center}
.rnode{background:var(--panel);border:2px solid var(--line);border-radius:13px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.rnode.av{border-color:var(--c)}.rnode.max{border-color:var(--c);box-shadow:0 0 14px rgba(255,201,74,.25)}.rnode.lock{opacity:.5}
.rn-h{display:flex;gap:6px;align-items:center}.rn-i{font-size:18px}.rn-l{margin-left:auto;color:var(--c);font-weight:700}
.rpips{display:flex;gap:3px}.rpips i{flex:1;height:5px;border-radius:3px;background:#0d1426}.rpips i.on{background:var(--c)}
.rlink{width:4px;height:16px;margin:0 auto;background:#2b3b62;border-radius:2px}.rlink.on{background:var(--c)}
.ctg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:10px}
.ctboard h4{margin:12px 0 8px;color:var(--gold)}
.ctc{background:linear-gradient(170deg,#3a2c1c,#1d2238);border:2px solid #7a5c34;border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:13px;position:relative;box-shadow:inset 0 0 0 1px rgba(255,220,150,.08)}

function mix(h,a){const[r,g,b]=hexRgb(h);const t=a>0?255:0,p=Math.abs(a);return`rgb(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)})`;}

function load(){
 try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const d=JSON.parse(raw);const base=newState();
   const m=(a,b)=>{for(const k in a){if(b[k]===undefined)b[k]=a[k];else if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))m(a[k],b[k]);}return b;};
   S=m(base,d);S.v=3;S.inv=S.inv.filter(i=>PART[i.pid]);S.inv.forEach(i=>{if(i.quality==null)i.quality=1;if(!S.seen.includes(i.pid))S.seen.push(i.pid);});for(const sl of SLOTS)if(S.equip[sl]&&!invGet(S.equip[sl]))S.equip[sl]=null;return;}}catch(e){console.warn('load failed',e);}
 S=newState();
}

/* ========================= STATS ========================= */
function invGet(uid){return S.inv.find(i=>i.uid===uid)||null;}
function fmtStat(k,v,sign){const s=sign&&v>=0?'+':'';if(k==='P'||k==='C')return s+Math.round(v);return s+(Math.round(v*10)/10).toFixed(1)+'%';}
function statLine(st,html=true){const n={P:'P',S:'S',M:'M',C:'C'};const parts=[];for(const k of['P','S','M','C'])if(st[k]!==undefined){const v=st[k];parts.push(html?`<span class="${v<0?'neg':''}">${n[k]} ${fmtStat(k,v,true)}</span>`:`${n[k]} ${fmtStat(k,v,true)}`);}return parts.join(' · ');}
function famCount(eq){const f=new Set();for(const sl of SLOTS){const i=eq[sl]&&invGet(eq[sl]);if(i)f.add(PART[i.pid].fam);}return f.size;}
/* ลำดับคำนวณ: Base Part → Level → Evolution (partStats) → รวมทุกชิ้น + Branch → Research → Synergy (passive) → Clamp → Derived */
function curStats(){const st=calcStats(S.equip);if(st.P>S.stats.maxP){S.stats.maxP=st.P;}return st;}

/* ========================= GACHA ========================= */
function rollRarity(rng,minRi){let pool=RAR.map((r,i)=>i).filter(i=>i>=minRi);const tot=pool.reduce((a,i)=>a+RAR[i].rate,0);let x=rng()*tot;for(const i of pool){x-=RAR[i].rate;if(x<0)return i;}return pool[pool.length-1];}
/* ========================= PART OPS ========================= */
function upCost(inst){const r=RAR[PART[inst.pid].ri];const nl=inst.lvl+1;return{coins:20*r.mult*nl*nl,scrap:nl<=3?0:Math.ceil(r.dis*.2*(nl-3))};}
function equippedSlot(uid){for(const sl of SLOTS)if(S.equip[sl]===uid)return sl;return null;}
function doEquip(slot,uid){const inst=invGet(uid);if(!inst)return false;if(PART[inst.pid].type!==SLOT_TYPE[slot]){toast('ชิ้นส่วนนี้ใส่ช่องนี้ไม่ได้','err');return false;}
 const other=equippedSlot(uid);if(other&&other!==slot){S.equip[other]=null;toast(`ย้าย ${PART[inst.pid].name} จาก ${SLOT_NAME[other].split(' ·')[0]}`);}
 S.equip[slot]=uid;wsAnim.pop=1;sfx('equip');afterChange();return true;}
function doUnequip(slot){S.equip[slot]=null;sfx('click');afterChange();}
function afterChange(){curStats();checkSynergy();saveSoon();renderWorkshop();if(modalRefresh)modalRefresh();}

/* ========================= QUESTS ========================= */
function nextQuest(s){
 for(let guard=0;guard<QUESTS.length*2;guard++){
  const q=QUESTS[s.quests.ptr];s.quests.ptr++;if(s.quests.ptr>=QUESTS.length){s.quests.ptr=0;s.quests.cycle++;}
  if(q.once&&s.quests.done.includes(q.id))continue;if(s.quests.active.some(a=>a.id===q.id))continue;
  const cyc=q.once?0:s.quests.cycle;s.quests.active.push({id:q.id,start:q.stat?s.stats[q.stat]:0,cycle:cyc});return;}
}
function questInfo(a){const q=QUESTS.find(x=>x.id===a.id);if(!q)return null;const n=q.once?q.n:Math.round(q.n*(1+a.cycle*.6));
 const prog=q.abs?q.abs(S):S.stats[q.stat]-a.start;return{q,n,prog:Math.min(n,prog),done:prog>=n,text:q.text.replace('{n}',fmt(n))};}
function rwText(rw){const o=[];if(rw.tickets)o.push(`🎫${rw.tickets}`);if(rw.coins)o.push(`🪙${fmt(rw.coins)}`);if(rw.scrap)o.push(`⚙️${rw.scrap}`);if(rw.shards)o.push(`💠${rw.shards}`);if(rw.cores)o.push(`🔶${rw.cores}`);if(rw.data)o.push(`📘${rw.data}`);return o.join(' ');}
function claimQuest(i){const a=S.quests.active[i];const qi=a&&questInfo(a);if(!qi||!qi.done)return;const rw=qi.q.rw;
 S.tickets+=rw.tickets||0;S.coins+=rw.coins||0;S.scrap+=rw.scrap||0;if(qi.q.once)S.quests.done.push(qi.q.id);
 S.quests.active.splice(i,1);nextQuest(S);toast(`✅ รับรางวัล ${rwText(rw)}`,'gold');sfx('coin');afterChange();}
function claimAch(id){const a=ACH.find(x=>x.id===id);if(!a||S.ach.includes(id)||!a.ok(S))return;S.ach.push(id);S.tickets+=a.rw;toast(`🏆 ${a.text} +${a.rw} 🎫`,'gold');sfx('coin');afterChange();}

 const g=c.createRadialGradient(56,56,8,56,56,70);g.addColorStop(0,rgba(ev>=2?f.c3:RAR[p.ri].color,ev>=2?.5:.35));g.addColorStop(1,'rgba(10,15,30,0)');c.fillStyle=g;c.fillRect(0,0,112,112);c.save();
 if(p.type==='head'){c.translate(56,62);c.scale(1.85,1.85);}else if(p.type==='core'){c.translate(56,56);c.scale(1.65,1.65);}
 else if(p.type==='arm'){c.translate(56,10);c.scale(1.45,1.45);}else if(p.type==='legs'){c.translate(56,26);c.scale(1.5,1.5);}else{c.translate(56,96);c.scale(1.18,1.18);}
 if(p.type==='legs'){for(const s of[-1,1]){c.save();c.translate(13*s,0);if(s<0)c.scale(-1,1);SH[p.fam].leg(c,f,.4,s);evoFx(c,'leg',f,ev,.4);c.restore();}}else{SH[p.fam][p.type](c,f,.4,1);evoFx(c,p.type,f,ev,.4);}
 c.restore();if(ev){c.font='bold 17px sans-serif';c.textAlign='right';c.fillStyle=ev>=2?'#ffd84a':'#7fe6ff';c.fillText(ev>=2?'✦✦':'✦',106,20);}ICON[key]=cv.toDataURL();return ICON[key];}

/* ========================= DUNGEON ========================= */
const W=22,H=14;const T_FLOOR=0,T_WALL=1,T_RUBBLE=2,T_SLOW=3,T_LAVA=4,T_SECRET=5;
let R=null;
function genDungeon(d,seed,opt){
 opt=opt||{};const mods=opt.mods||[];const has=k=>mods.includes(k);
 const rng=mulberry32(seed);const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
 const g=new Uint8Array(W*H),deco=new Uint8Array(W*H),room=new Uint8Array(W*H);const I=(x,y)=>y*W+x;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x===0||y===0||x===W-1||y===H-1)g[I(x,y)]=T_WALL;
 const ent={x:1,y:ri(3,H-4)};const prot=(x,y)=>Math.abs(x-ent.x)<=2&&Math.abs(y-ent.y)<=2;
 let rm=null,secretIdx=-1;const rtype=d.room||(has('hidden')?'secret':null);
 if(rtype&&(rtype==='bonus'||rng()<(has('hidden')?.95:.65))){const top=rng()<.5;const rx0=W-7,ry0=top?1:H-6;rm={x0:rx0+1,y0:ry0+1,x1:W-2,y1:ry0+4,type:rtype};
  for(let y=ry0;y<=ry0+5;y++)for(let x=rx0;x<=W-1;x++){if(y<0||y>=H)continue;const inner=x>rx0&&x<W-1&&y>ry0&&y<ry0+5;room[I(x,y)]=inner?2:1;g[I(x,y)]=inner?T_FLOOR:T_WALL;}
  const sx=rx0,sy=ri(rm.y0,rm.y1);secretIdx=I(sx,sy);g[secretIdx]=T_SECRET;}
 const free=(x,y)=>x>0&&y>0&&x<W-1&&y<H-1&&!prot(x,y)&&!room[I(x,y)];
 const walk=(n,len,tile,onlyFloor)=>{for(let k=0;k<n;k++){let x=ri(3,W-4),y=ri(1,H-2);for(let s=0;s<len;s++){if(free(x,y)&&(!onlyFloor||g[I(x,y)]===T_FLOOR))g[I(x,y)]=tile;const dir=ri(0,3);x+=[1,-1,0,0][dir];y+=[0,0,1,-1][dir];x=clamp(x,1,W-2);y=clamp(y,1,H-2);}}};
 walk(ri(8,11),ri(4,7),T_WALL);
 if(has('shift'))walk(ri(5,7),ri(5,8),T_WALL);if(opt.extraWalls)walk(ri(3,4),ri(4,6),T_WALL);
 for(let k=0;k<ri(5,9);k++){const x=ri(3,W-3),y=ri(1,H-2);if(free(x,y)&&g[I(x,y)]===T_FLOOR)g[I(x,y)]=T_RUBBLE;}
 if(d.hz.slow)walk(ri(2,3),ri(6,9),T_SLOW,true);if(d.hz.lava)walk(3,ri(7,11),T_LAVA,true);if(has('heat'))walk(ri(2,3),ri(5,8),T_LAVA,true);
 if(d.hz.rails){const ry=ri(2,H-3);for(let x=1;x<W-1;x++)if(g[I(x,ry)]===T_FLOOR&&!room[I(x,ry)])deco[I(x,ry)]=1;}
 // connectivity: ทุกพื้นที่เดินได้ต้องเชื่อมกับทางเข้า (ที่เหลือกลายเป็นกำแพง) → AI หาทางได้เสมอ
 const seen=new Uint8Array(W*H);const q=[I(ent.x,ent.y)];seen[q[0]]=1;
 while(q.length){const i=q.shift();const x=i%W,y=(i/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const j=I(x+dx,y+dy);if(seen[j])continue;const tt=g[j];if(tt===T_WALL||tt===T_RUBBLE)continue;seen[j]=1;q.push(j);}}
 for(let i=0;i<W*H;i++)if(!seen[i]&&(g[i]===T_FLOOR||g[i]===T_SLOW||g[i]===T_LAVA)&&!room[i])g[i]=T_WALL;
 const ores=[];const oreAt=new Array(W*H).fill(null);
 const wts=d.wts.slice();if(has('heat'))wts[wts.length-1]*=1.8;const hpMul=(opt.hpMul||1)*(has('heavy')?1.4:1);
 const pickTier=()=>{let tot=wts.reduce((a,b)=>a+b,0),x=rng()*tot;for(let k=0;k<d.tiers.length;k++){x-=wts[k];if(x<0)return d.tiers[k];}return d.tiers[0];};
 const nearLava=(x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const j=I(x+dx,y+dy);if(g[j]===T_LAVA)return true;}return false;};
 const mk=(x,y,tier,extra={})=>{const T=TIERS[tier];const hp=Math.round(T.hp*hpMul);const o=Object.assign({id:ores.length,x,y,tier,hp,maxHp:hp,name:T.ores[Math.floor(rng()*2)][0],hidden:false,hot:nearLava(x,y),seed:rng(),hitT:0},extra);ores.push(o);oreAt[I(x,y)]=o;return o;};
 const cand=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=I(x,y);if(seen[i]&&!room[i]&&(g[i]===T_FLOOR||g[i]===T_SLOW)&&!prot(x,y))cand.push(i);}
 const candSet=new Set(cand);
 for(let i=cand.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]];}
 const n=Math.min(50,Math.floor(cand.length*.27));const top=d.tiers[d.tiers.length-1];
 for(let k=0;k<n;k++){const i=cand[k];mk(i%W,(i/W)|0,pickTier());}
 if(has('rush')){const extra=Math.round(n*.3);let placed=0;for(let a=0;a<extra*8&&placed<extra;a++){const b=ores[Math.floor(rng()*ores.length)];if(!b)break;const x=b.x+ri(-1,1),y=b.y+ri(-1,1);const i=I(x,y);if(!candSet.has(i)||oreAt[i])continue;mk(x,y,pickTier());placed++;}}
 // hidden rare ores
 let hc=0;const hmax=has('hidden')?4+(rng()<.4?1:0):3;for(let k=n;k<cand.length&&hc<hmax;k++){const i=cand[k];if(oreAt[i])continue;const x=i%W,y=(i/W)|0;let adjWall=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(g[I(x+dx,y+dy)]===T_WALL)adjWall++;if(adjWall>=1){mk(x,y,top,{hidden:true});hc++;}}
 if(rm){for(let y=rm.y0;y<=rm.y1;y++)for(let x=rm.x0;x<=rm.x1;x++)if(rng()<.62)mk(x,y,rng()<.5?top:d.tiers[Math.max(0,d.tiers.length-2)]);
  const sx=secretIdx%W,sy=(secretIdx/W)|0;const o={id:ores.length,x:sx,y:sy,tier:0,hp:160,maxHp:160,name:rm.type==='bonus'?'ผนังร้าว':'ผนังลับ',secret:true,revealed:rm.type==='bonus',hidden:false,seed:rng(),hitT:0};ores.push(o);oreAt[secretIdx]=o;}
 // รับประกันแร่ที่ขุดได้ตาม Mining Power
 if(opt.maxTier){const need=opt.need||6;let mineN=ores.filter(o=>!o.secret&&!o.hidden&&o.tier<=opt.maxTier).length;
  for(const o of ores){if(mineN>=need)break;if(o.secret||o.hidden||o.tier<=opt.maxTier)continue;const nt=Math.max(1,opt.maxTier);const T=TIERS[nt];o.tier=nt;o.name=T.ores[Math.floor(rng()*2)][0];o.hp=o.maxHp=Math.round(T.hp*hpMul);mineN++;}}
 return{g,deco,ent,ores,oreAt,room:rm,seed,mods};
}
function startRun(did,seed){
 const d=DMAP[did];if(!S.unlocked[did]){toast('ยังไม่ปลดล็อก','err');return;}
 const st=calcStats(S.equip);seed=seed||Math.floor(Math.random()*1e9);const mod=dungeonMod(did);const mods=mod==='normal'?[]:[mod];
 const m=genChecked(d,seed,{mods,maxTier:st.maxTier,need:8});
 initRun('normal',d,m,st,{seed,mods,valMul:MODS[mod].coin,time:S.settings.runTime});R.modId=mod;
 enterView('⛏ '+d.name+(mod!=='normal'?` · ${MODS[mod].icon} ${MODS[mod].name}`:''));
 toast(`เข้าสู่ ${d.name}! ขุดได้ถึง Tier ${st.maxTier}${mod!=='normal'?` · ${MODS[mod].name}`:''}`,'ok');
 return R;
}

function ix(x,y){return y*W+x;}
function lavaF(){return terr(R.fx.has('frostbound_legs')?1:R.fx.has('frostbound_core')?.75:.5);}
function slowF(){return terr(R.fx.has('zephyr_back')?.8:.55);}
function tileF(i){const t=R.map.g[i];return t===T_SLOW?slowF():t===T_LAVA?lavaF():1;}
function hasBlink(){return R.fx.has('void_legs');}
function walkable(i){if(i<0||i>=W*H)return false;if(R.oreAt[i])return false;const t=R.map.g[i];return t===T_FLOOR||t===T_SLOW||t===T_LAVA||(t===T_RUBBLE&&hasBlink());}
function stand(i){return walkable(i)&&R.map.g[i]!==T_RUBBLE;}
function dijkstra(src){const N=W*H;const dist=new Float32Array(N).fill(Infinity),prev=new Int16Array(N).fill(-1),done=new Uint8Array(N);dist[src]=0;
 const open=[src];while(open.length){let bi=0;for(let k=1;k<open.length;k++)if(dist[open[k]]<dist[open[bi]])bi=k;const u=open[bi];open[bi]=open[open.length-1];open.pop();if(done[u])continue;done[u]=1;
  const ux=u%W,uy=(u/W)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const vx=ux+dx,vy=uy+dy;if(vx<0||vy<0||vx>=W||vy>=H)continue;const v=ix(vx,vy);if(done[v]||!walkable(v))continue;
   if(dx&&dy&&(!walkable(ix(ux+dx,uy))||!walkable(ix(ux,uy+dy))))continue;const t=R.map.g[v];let cost=(dx&&dy?1.414:1)/tileF(v);if(t===T_LAVA)cost+=.8;if(t===T_RUBBLE)cost+=1.2;
   const nd=dist[u]+cost;if(nd<dist[v]){dist[v]=nd;prev[v]=u;open.push(v);}}}
 return{dist,prev};}
function pathTo(D,goal){const p=[];let c=goal;while(c!==-1&&D.prev[c]!==-1){p.push(c);c=D.prev[c];}return p.reverse();}
function gTile(){return ix(clamp(Math.floor(R.g.x),0,W-1),clamp(Math.floor(R.g.y),0,H-1));}
function gDist(x,y){return Math.hypot(R.g.x-(x+.5),R.g.y-(y+.5));}
function oreVisible(o){return !o.hidden&&!o.closed&&(!o.secret||o.revealed);}
function canMine(o){return o.secret?true:R.st.P>=TIERS[o.tier].req;}
function oreW(o){return o.secret||o.boss?0:TIERS[o.tier].w;}
function bagFits(tier){if(!tier)return true;const w=TIERS[tier].w;if(R.bag.w+w<=R.st.C)return true;if(tier>=5&&R.bag.res+w<=resCap())return true;return false;}
function bagAdd(name,tier){const w=TIERS[tier].w;if(R.bag.w+w<=R.st.C)R.bag.w+=w;else R.bag.res+=w;const it=R.bag.items[name]||(R.bag.items[name]={tier,count:0});it.count++;R.collectedCount++;R.bag.val+=TIERS[tier].price*R.valMul;}
function bagValue(){return Math.round(R.bag.val+(R.exp?R.exp.val:0));}
function oreValue(o){return o.secret?250:o.boss?999:Math.round(TIERS[o.tier].price*(R.valMul||1));}
function notify(key,msg,type='',cd=3){const now=R.elapsed;if(R.msg[key]!==undefined&&now-R.msg[key]<cd)return;R.msg[key]=now;toast(msg,type);}
function bestStand(D,o){let best=-1,bd=Infinity;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=o.x+dx,y=o.y+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=ix(x,y);
  if(dx&&dy){/* diagonal mining needs no corner rule */}if(!stand(i)&&i!==gTile())continue;if(D.dist[i]<bd){bd=D.dist[i];best=i;}}return{i:best,d:bd};}
function setTarget(tgt,manual){
 const g=R.g;const D=dijkstra(gTile());let goal;
 if(tgt.kind==='ore'){const o=tgt.o;if(gDist(o.x,o.y)<=1.55){g.tgt=tgt;g.path=[];g.state='mine';g.settle=settleTime();g.manual=manual;return true;}const b=bestStand(D,o);if(b.i<0||b.d===Infinity)return false;goal=b.i;}
 else if(tgt.kind==='drop'){goal=ix(Math.floor(tgt.d.x),Math.floor(tgt.d.y));if(D.dist[goal]===Infinity){const o={x:Math.floor(tgt.d.x),y:Math.floor(tgt.d.y)};const b=bestStand(D,o);if(b.i<0||b.d===Infinity)return false;goal=b.i;}}
 else{goal=tgt.i;if(D.dist[goal]===Infinity)return false;}
 const path=pathTo(D,goal);g.tgt=tgt;g.path=path;g.pathGoal=goal;g.manual=manual;g.state=path.length?'walk':(tgt.kind==='ore'?'mine':'idle');g.settle=settleTime();
 if(path.length&&tgt.kind==='ore'&&R.fx.has('thunder_legs')&&R.flashCd<=0){R.boost=.6;R.flashCd=10;for(let k=0;k<10;k++)part(g.x,g.y,'#9ef0ff',3,2);}
 return true;}
function settleTime(){return(R.fx.has('drilltech_legs')?0:R.fx.has('scrap_legs')?.1:.3)*(1-.05*rl('A4'));}
function chooseTarget(){
 const g=R.g;const D=dijkstra(gTile());const spd=R.st.move;let best=null,bs=-Infinity;let anyMineable=false,fullBlock=false;
 for(const dr of R.drops){if(dr.fly)continue;if(!bagFits(dr.tier)){fullBlock=true;continue;}const i=ix(Math.floor(dr.x),Math.floor(dr.y));let dd=D.dist[i];if(dd===Infinity){const b=bestStand(D,{x:Math.floor(dr.x),y:Math.floor(dr.y)});dd=b.d;}if(dd===Infinity)continue;
  const sc=R.mode==='nearest'?-dd+.5:TIERS[dr.tier].price*R.valMul/(dd/spd+.3);if(sc>bs){bs=sc;best={kind:'drop',d:dr};}}
 for(const o of R.ores){if(!oreVisible(o)||!canMine(o))continue;anyMineable=true;if(!bagFits(o.tier)&&!o.secret&&!o.boss){fullBlock=true;continue;}
  const near=gDist(o.x,o.y)<=1.55;const dd=near?0:bestStand(D,o).d;if(dd===Infinity)continue;
  const mineT=Math.ceil(o.hp/R.st.rawP)*R.st.interval;const sc=R.mode==='nearest'?-dd:oreValue(o)/(dd/spd+mineT+.5);if(sc>bs){bs=sc;best={kind:'ore',o};}}
 if(best){setTarget(best,false);return true;}
 if(fullBlock){notify('full','🎒 กระเป๋าเต็ม! กด Extract เพื่อกลับฐานขายแร่','err',6);$('#bExtract').classList.add('pulse');}
 else if(!anyMineable&&R.type!=='boss')notify('none','ไม่มีแร่ที่ขุดได้เหลือแล้ว — กด Extract','',8);
 g.idleWait=.6;return false;}
function damageOre(o,amt,src){
 if(!o||R.ores.indexOf(o)<0||o.closed)return 0;
 if(o.hidden){revealHidden(o);return 0;}
 if(o.secret&&!o.revealed){o.revealed=true;floatTxt(o.x+.5,o.y+.2,'พบผนังลับ!','#ff9df0');}
 if(!canMine(o)){floatTxt(o.x+.5,o.y+.3,'Power ไม่พอ','#ff8a95');return 0;}
 let m=1;const t=o.tier;
 if(!o.secret){if(R.fx.has('stoneguard_head')&&t<=2)m*=1.1;if(R.fx.has('titanstone_head')&&t>=3)m*=1.1;if(o.hot&&R.fx.has('frostbound_head'))m*=1.15;if(o.hot&&R.fx.has('magma_head'))m*=1.2;}
 let crit=false;if(R.fx.has('drilltech_head')&&Math.random()<.15){m*=1.5;crit=true;}
 m*=1+.02*rl('A3');if(R.st.tr&&R.st.tr.ore[o.tier]&&!o.secret)m*=1+R.st.tr.ore[o.tier]/100;
 if(R.syn.has('thermal')&&o.hot&&!o.secret){if(R.elapsed<(o.brit||0))m*=1.2;else if(R.elapsed>=(o.britCd||0)){o.brit=R.elapsed+5;o.britCd=R.elapsed+12;floatTxt(o.x+.5,o.y-.3,'♨️ Brittle!','#bfe8ff',.9);for(let k=0;k<10;k++)part(o.x+.5,o.y+.3,'#e9fbff',3,3);}}
 const dmg=amt*m;o.hp-=dmg;R.dmgT=(R.dmgT||0)+dmg;if(R.inSkill)R.dmgS=(R.dmgS||0)+dmg;o.hitT=.15;const ti=o.secret?null:ORE_INFO[o.name];
 floatTxt(o.x+.5+(Math.random()-.5)*.3,o.y+.1,(crit?'💥':'')+Math.round(dmg),crit?'#ffd84a':'#ffffff',crit?1.25:1);
 for(let k=0;k<5;k++)part(o.x+.5,o.y+.5,ti?ti.c1:'#bbb',2.5,3);
 if(o.hp<=0)breakOre(o);return dmg;}
function breakOre(o){
 const i=ix(o.x,o.y);R.ores.splice(R.ores.indexOf(o),1);R.oreAt[i]=null;
 if(o.boss){if(R.g.tgt&&R.g.tgt.o===o){R.g.tgt=null;R.g.state='idle';R.g.idleWait=.05;}bossBreak(o);return;}
 if(o.secret){R.map.g[i]=T_FLOOR;toast(o.name==='ผนังร้าว'?'🧱 ทะลวงเข้าห้องแร่โบนัส!':'✨ พบห้องลับ!','gold');for(let k=0;k<30;k++)part(o.x+.5,o.y+.5,'#ff9df0',5,4);sfx('break',4);R.shake=.3;return;}
 R.mined++;S.stats.mined++;S.stats.tier[o.tier]++;const info=ORE_INFO[o.name];if(R.inSkill){R.skillBreaks++;ctEvent('skill');}ctEvent('mine',o.tier);if(R.type==='endless')endlessBreak();
 for(let k=0;k<16+o.tier*3;k++)part(o.x+.5,o.y+.5,k%2?info.c1:info.c2,4+o.tier*.4,5);R.efx.push({type:'ring',x:o.x+.5,y:o.y+.5,r:1,t:0,dur:.35,col:info.c1});
 sfx('break',o.tier);breakFx(o);R.drops.push({x:o.x+.5,y:o.y+.5,tier:o.tier,name:o.name,t:0,fly:false,vy:-2});
 if(R.g.tgt&&R.g.tgt.o===o){R.g.tgt=null;R.g.state='idle';R.g.idleWait=.05;}}
function updDrops(dt){const g=R.g;const pr=pickupR();
 for(let k=R.drops.length-1;k>=0;k--){const d=R.drops[k];d.t+=dt;
  if(d.fly){const dx=g.x-d.x,dy=g.y-d.y,l=Math.hypot(dx,dy);if(l<.35){if(bagFits(d.tier)){bagAdd(d.name,d.tier);floatTxt(g.x,g.y-1.2,'+'+d.name,ORE_INFO[d.name].c1,.9);sfx('pick');R.drops.splice(k,1);}else{d.fly=false;}continue;}
   const sp=Math.min(l,14*dt);d.x+=dx/l*sp;d.y+=dy/l*sp;continue;}

function rollTraitFor(pid,not){const p=PART[pid];let pool=TRAIT_POOL[p.type];if(not&&pool.length>1&&Math.random()<.5)pool=pool.filter(x=>x!==not);const id=pool[Math.floor(Math.random()*pool.length)];const T=TRAITS[id];
 const k=clamp((p.ri+Math.random()*1.6)/6.6,0,1);let v=T.range[0]+(T.range[1]-T.range[0])*k;v=T.int?Math.round(v):Math.round(v*10)/10;const o={trait:id,tv:v};if(id==='ore')o.tt=clamp(p.ri+1+Math.floor(Math.random()*2),1,6);return o;}

/* ---------- STATS (order: Base → Level(+3%) → Evolution → Quality → Trait → sum → Branch → Research → Synergy → Clamp) ---------- */
function partStats(inst){const d=PART[inst.pid];const o={};const ev=inst.evo||0;const eb=ev>=2?.10:ev>=1?.05:0;const qm=QUAL[qOf(inst)].mul;
 for(const k in d.stats){const v=d.stats[k];if(v>0){let e=eb;if(ev>=2&&(inst.br||'A')==='A'&&d.type==='core'&&k==='P')e+=.05;o[k]=v*(1+0.03*((inst.lvl||1)-1))*(1+e)*qm;}else o[k]=v;}
 const T=traitOf(inst);if(T&&T.stat)o[T.stat]=(o[T.stat]||0)+inst.tv;return o;}
function partBreak(inst){const d=PART[inst.pid];const rows=[];const ev=inst.evo||0;const eb=ev>=2?.10:ev>=1?.05:0;const qm=QUAL[qOf(inst)].mul;const T=traitOf(inst);
 const keys=new Set(Object.keys(d.stats));if(T&&T.stat)keys.add(T.stat);
 for(const k of['P','S','M','C']){if(!keys.has(k))continue;const v=d.stats[k]||0;let e=eb;if(ev>=2&&(inst.br||'A')==='A'&&d.type==='core'&&k==='P')e+=.05;const lv=v>0?v*.03*((inst.lvl||1)-1):0;const evv=v>0?v*(1+.03*((inst.lvl||1)-1))*e:0;const qv=v>0?v*(1+.03*((inst.lvl||1)-1))*(1+e)*(qm-1):0;const tv=T&&T.stat===k?inst.tv:0;
  rows.push({k,base:v,lv,ev:evv,q:qv,tr:tv,tot:(partStats(inst)[k]||0)});}return rows;}
function calcStats(eq){
 let P=10,Sp=100,M=100,C=20;const fx=new Set(),look={},parts={},evo={},br={},qual={};const tr={ore:{},col:0,sense:0,guard:0};
 for(const sl of SLOTS){const inst=eq[sl]?invGet(eq[sl]):null;if(!inst){look[sl]=null;evo[sl]=0;br[sl]=null;qual[sl]=1;continue;}
  look[sl]=inst.pid;parts[sl]=inst;evo[sl]=inst.evo||0;qual[sl]=qOf(inst);br[sl]=evo[sl]>=2?(inst.br||'A'):null;const st=partStats(inst);P+=st.P||0;Sp+=st.S||0;M+=st.M||0;C+=st.C||0;fx.add(inst.pid);
  if(inst.trait==='ore')tr.ore[inst.tt]=(tr.ore[inst.tt]||0)+inst.tv;else if(inst.trait==='collector')tr.col+=inst.tv;else if(inst.trait==='sense')tr.sense+=inst.tv;else if(inst.trait==='guard')tr.guard+=inst.tv;}
 tr.guard=Math.min(60,tr.guard);
 if(br.core==='B')Sp+=6;if(br.legs==='A')M+=10;if(br.back==='A')C+=25;
 const pS=Sp-100,pM=M-100,pC=C-20;const rb=researchBonus();Sp+=rb.S;M+=rb.M;C+=rb.C;
 const syn=synOf(look);const yM=syn.has('storm')?15:0;M+=yM;
 const o={raw:{P,S:Sp,M,C},fx,look,parts,evo,br,qual,syn,tr,cap:{S:[30,250],M:[40,200],C:[10,300]},bd:{S:[pS,rb.S,0],M:[pM,rb.M,yM],C:[pC,rb.C,0]}};
 o.rawP=Math.max(10,P);o.P=Math.max(10,Math.round(P));
 o.S=Math.round(clamp(Sp,30,250)*10)/10;o.M=Math.round(clamp(M,40,200)*10)/10;o.C=clamp(Math.round(C),10,300);
 o.interval=clamp(1.2/(o.S/100),.35,2.5);o.move=2.4*o.M/100;
 o.maxTier=0;for(let t=1;t<=6;t++)if(o.P>=TIERS[t].req)o.maxTier=t;
 o.skills=['armL','armR'].map(sl=>{const pid=look[sl];if(!pid||!SKILLS[pid])return null;const sk=Object.assign({pid,fam:PART[pid].fam,slot:sl},SKILLS[pid]);
   let cd=sk.cd;if(sk.fam==='magma'&&fx.has('magma_back'))cd*=.9;if(sk.fam==='thunder'&&fx.has('thunder_back'))cd*=.9;
   cd*=1-.02*rl('A2');const b=br[sl];if(b==='B')cd*=.88;if(parts[sl]&&parts[sl].trait==='saver')cd*=1-parts[sl].tv/100;
   if(b==='A'){if(sk.mult)sk.mult*=1.15;if(sk.type==='buff')sk.amount=Math.round(sk.amount*1.1);if(sk.type==='dash')sk.tiles=Math.round(sk.tiles*1.1);if(sk.type==='pull')sk.radius=Math.round(sk.radius*1.1*10)/10;}
   if(pid==='frostbound_arm'&&syn.has('frozen'))sk.radius+=1;if(pid==='void_arm'&&syn.has('dimension'))sk.len+=1;
   sk.cdEff=Math.round(cd*10)/10;sk.br=b;return sk;});
 return o;}

/* ---------- inventory helpers ---------- */
function addPart(s,pid,lvl=1){const uid='p'+(s.nextUid++);s.inv.push({uid,pid,lvl,quality:1,isNew:true});if(s.seen&&!s.seen.includes(pid))s.seen.push(pid);return uid;}
function summonOne(){
 const p=S.pity;const n=p.total+1;let ri=rollRarity(Math.random,0);let guar=null;
 if(p.sinceMyth+1>=150){ri=5;guar='Mythic';}
 else if(p.sinceLeg+1>=60&&ri<4){ri=rollRarity(Math.random,4);guar='Legendary+';}
 else if(n===5&&!p.first5Rare&&ri<2){ri=rollRarity(Math.random,2);guar='Rare+ (5 ครั้งแรก)';}
 else if(p.sinceRare+1>=10&&ri<2){ri=rollRarity(Math.random,2);guar='Rare+';}
 p.total=n;p.sinceRare=ri>=2?0:p.sinceRare+1;p.sinceLeg=ri>=4?0:p.sinceLeg+1;p.sinceMyth=ri>=5?0:p.sinceMyth+1;if(n<=5&&ri>=2)p.first5Rare=true;
 const pool=PART_LIST.filter(x=>x.ri===ri);const pd=pool[Math.floor(Math.random()*pool.length)];
 const uid=addPart(S,pd.id);const inst=invGet(uid);inst.quality=rollQuality();if(Math.random()*100<TRAIT_CH[ri])Object.assign(inst,rollTraitFor(pd.id));
 S.stats.summons++;S.stats.bestRar=Math.max(S.stats.bestRar,ri);return{uid,pid:pd.id,ri,guar};}
