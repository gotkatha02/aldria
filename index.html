<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Build a Golem — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1220;--bg2:#121a2e;--panel:#17213a;--panel2:#1d2a48;--line:#2b3b62;--text:#e9effc;--muted:#8fa2c8;
  --cyan:#3fe0ff;--gold:#ffc94a;--red:#ff5d6c;--green:#52e08a;
  --r0:#9aa3b2;--r1:#4cd964;--r2:#3f8cff;--r3:#b05cff;--r4:#ffc23d;--r5:#ff4f8b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#1b2b52 0%,var(--bg) 60%)}
/* topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,15,28,.85);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:1px;font-size:18px;background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
.res{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-weight:600;font-size:14px;min-width:70px;justify-content:center}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:38px;height:34px;padding:0 9px;font-size:15px}
.ibtn:hover{border-color:var(--cyan)}
.dbg-btn{background:#5a1830;border-color:#ff4f8b;color:#ffd0df;font-weight:700;font-size:12px}
/* workshop */
.screen{flex:1;min-height:0}
#workshop{overflow:auto}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1400px;margin:0 auto}
.stage{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;gap:10px;align-items:center;background:linear-gradient(180deg,#16223e,#111a30);border:1px solid var(--line);border-radius:18px;padding:12px;position:relative}
.cv-wrap{position:relative;height:430px;min-width:0}
#wcv{width:100%;height:100%;display:block}
.stage-tag{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(0,0,0,.3);padding:2px 10px;border-radius:10px;white-space:nowrap}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:left;min-height:68px;transition:transform .1s,border-color .2s}
.slot:hover{transform:translateY(-2px)}
.slot img,.slot .noimg{width:50px;height:50px;border-radius:10px;background:#0e1527;flex-shrink:0}
.slot .noimg{display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.5}
.slot .sl-l{font-size:11px;color:var(--muted)}
.slot .sl-n{font-size:13px;font-weight:600;line-height:1.15}
.slot .sl-v{font-size:11px;color:var(--muted)}
.navbar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.nbtn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center}
.nbtn .e{font-size:22px}
.nbtn:hover{border-color:var(--cyan);background:#22335a}
.nbtn.main{background:linear-gradient(180deg,#ffd35e,#e09a1c);color:#2a1700;border-color:#ffe08a}
.nbtn .badge{background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 6px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--cyan);display:flex;align-items:center;gap:6px}
.stat{margin-bottom:8px}
.stat .row{display:flex;justify-content:space-between;font-size:14px}
.stat .row b{font-size:17px}
.bar{height:7px;background:#0d1426;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:5px}
.hint{font-size:12px;color:var(--muted);line-height:1.4}
.skrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;font-size:13px}
.skrow .ic{width:32px;height:32px;border-radius:9px;background:#0e1527;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;background:#101831;border:1px solid var(--line);border-radius:9px;padding:5px;font-size:13px}
.tab.on{background:var(--panel2);border-color:var(--cyan);color:var(--cyan)}
.quest{background:#111a31;border:1px solid var(--line);border-radius:11px;padding:8px;margin-bottom:7px;font-size:13px}
.quest .qt{display:flex;justify-content:space-between;gap:6px;align-items:center}
.quest .rw{font-size:11px;color:var(--gold);white-space:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#3fe0ff,#1e9ec4);color:#03202b;border-color:#8ff0ff}
.btn.gold{background:linear-gradient(180deg,#ffd35e,#e09a1c);color:#2a1700;border-color:#ffe08a}
.btn.red{background:#4a1622;border-color:#ff5d6c;color:#ffd0d6}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px;border-radius:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px;backdrop-filter:blur(3px)}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(940px,100%);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .18s ease-out}
.mbox.narrow{width:min(520px,100%)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.mhead h2{margin:0;font-size:18px;flex:1}
.mbody{padding:14px;overflow:auto;min-height:0}
.x{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:16px}
#confirm{z-index:80}
/* part cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:13px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;font-size:12px}
.pc:hover{transform:translateY(-2px)}
.pc .top{display:flex;gap:7px;align-items:center}
.pc img{width:48px;height:48px;border-radius:9px;background:#0e1527;flex-shrink:0}
.pc .nm{font-weight:600;font-size:13px;line-height:1.15}
.pc .rr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pc .eq{position:absolute;top:5px;right:6px;font-size:10px;background:var(--cyan);color:#012;border-radius:6px;padding:0 5px;font-weight:700}
.pc .cnt{position:absolute;bottom:5px;right:7px;font-size:10px;color:var(--muted)}
.sline{color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-family:inherit;font-size:13px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;background:#0f1730;border-radius:10px;padding:8px 10px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list .li{display:flex;gap:9px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 9px;margin-bottom:7px}
.list .li img{width:52px;height:52px;border-radius:9px;background:#0e1527;flex-shrink:0}
.list .li .mid{flex:1;min-width:0;font-size:12px}
.list .li .acts{display:flex;flex-direction:column;gap:5px}
.detail{display:grid;grid-template-columns:160px 1fr;gap:14px}
.detail img{width:160px;height:160px;border-radius:16px;background:#0e1527}
.tag{display:inline-block;font-size:11px;border-radius:7px;padding:1px 7px;background:#0f1730;border:1px solid var(--line);margin-right:4px}
/* summon */
.forge{display:flex;flex-direction:column;align-items:center;gap:10px}
#scv{width:min(420px,100%);height:220px;border-radius:14px;background:#0a0f1d}
.sres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.sres .pc{animation:rev .35s ease-out both}
@keyframes rev{from{transform:translateY(12px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.pity{font-size:12px;color:var(--muted);text-align:center}
.guar{font-size:9px;background:var(--gold);color:#2a1700;border-radius:5px;padding:0 4px;font-weight:700}
/* dungeon select */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcard{border-radius:16px;padding:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px;min-height:250px}
.dcard h4{margin:0;font-size:17px}
.dcard .ores{display:flex;flex-wrap:wrap;gap:4px}
.dcard .sp{flex:1}
/* dungeon */
#dungeon{position:fixed;inset:0;z-index:20;background:#05070d}
#dcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;align-items:center;flex-wrap:wrap;pointer-events:none;background:linear-gradient(180deg,rgba(5,8,16,.9),rgba(5,8,16,.55));border-bottom:1px solid rgba(80,110,170,.25)}
.hud-top>*{pointer-events:auto}
.hp{background:rgba(20,30,55,.9);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.hp.timer{font-size:17px;color:var(--gold);min-width:78px;text-align:center}
.hp.timer.low{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.bagw{display:flex;align-items:center;gap:6px;background:rgba(20,30,55,.9);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600}
.bagw .bar{width:110px;margin:0;height:9px}
.dname{font-weight:700;color:var(--cyan);font-size:14px;margin-right:auto}
.hud-bot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(5,8,16,.92),rgba(5,8,16,.5));border-top:1px solid rgba(80,110,170,.25)}
.hud-l{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:rgba(25,38,68,.95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px;min-height:46px;min-width:84px}
.hbtn.on{border-color:var(--green);color:var(--green)}
.hbtn.ext{background:linear-gradient(180deg,#ffd35e,#e09a1c);color:#2a1700;border-color:#ffe08a}
.hbtn.ext.pulse{animation:pulse .8s infinite}
.hbtn.ext.going{background:#3b2e10;color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,201,74,.35)}}
.hud-s{display:flex;gap:8px}
.skill{position:relative;width:76px;height:76px;border-radius:18px;background:rgba(25,38,68,.95);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:2px}
.skill .ic{font-size:26px;line-height:1}
.skill .nm{font-size:9.5px;line-height:1.05;text-align:center;margin-top:2px}
.skill .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) calc(var(--p,0)*1turn),transparent 0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.skill kbd{position:absolute;top:2px;left:5px;font-size:10px;color:var(--muted);font-family:inherit}
.skill.ready{border-color:var(--cyan);box-shadow:0 0 12px rgba(63,224,255,.35)}
.skill.none{opacity:.35}
.dbgbar{position:absolute;right:8px;top:62px;display:flex;flex-direction:column;gap:4px}
/* toast */
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(16,24,44,.96);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:tin .2s ease-out;text-align:center}
.toast.err{border-color:var(--red);color:#ffc4cb}.toast.ok{border-color:var(--green)}.toast.gold{border-color:var(--gold);color:var(--gold)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.result-big{font-size:34px;font-weight:800;color:var(--gold);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td:last-child,table.t th:last-child{text-align:right}
.preset{display:flex;flex-direction:column;gap:7px}
.preset input{background:#0f1730;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:7px 9px;font-family:inherit;font-size:14px;width:100%}
.picons{display:flex;gap:4px;flex-wrap:wrap}
.picons img{width:36px;height:36px;border-radius:7px;background:#0e1527}
.picons .miss{width:36px;height:36px;border-radius:7px;background:#3a1220;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--red)}
@media (max-width:1100px){.ws{grid-template-columns:1fr}.navbar{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  .ws{padding:8px;gap:10px}
  .stage{grid-template-columns:1fr 1fr;grid-template-areas:"cv cv" "l r";padding:8px}
  .cv-wrap{grid-area:cv;height:300px}
  .slots.left{grid-area:l}.slots.right{grid-area:r}
  .slot{min-height:58px;padding:5px 6px;gap:6px}
  .slot img,.slot .noimg{width:42px;height:42px}
  .slot .sl-n{font-size:12px}
  .dgrid{grid-template-columns:1fr}
  .dcard{min-height:0}
  .detail{grid-template-columns:1fr}
  .detail img{width:120px;height:120px}
  .logo{font-size:15px;width:100%;text-align:center}
  .res{min-width:0;font-size:13px;padding:3px 9px}
  .skill{width:66px;height:66px}
  .hbtn{min-width:0;padding:6px 9px;font-size:12px;min-height:42px}
  .hp{font-size:12px;padding:3px 7px}.hp.timer{font-size:15px;min-width:64px}
  .bagw .bar{width:60px}
  .dname{width:100%;font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .list .li{flex-wrap:wrap}
  .list .li img{width:44px;height:44px}
  .list .li .mid{flex:1 1 calc(100% - 60px)}
  .list .li .acts{flex-direction:row;width:100%;justify-content:flex-end}
  .cmp{font-size:12px}
  .mbody{padding:10px}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">⛏ BUILD A GOLEM</div>
    <div class="res" title="Golem Coins">🪙 <span id="rCoins">0</span></div>
    <div class="res" title="Part Tickets">🎫 <span id="rTix">0</span></div>
    <div class="res" title="Ancient Scrap">⚙️ <span id="rScrap">0</span></div>
    <button class="ibtn" data-act="toggleSound" id="bSound" title="เสียง">🔊</button>
    <button class="ibtn" data-act="openSettings" title="ตั้งค่า">⚙</button>
    <button class="ibtn dbg-btn hidden" id="bDebug" data-act="openDebug">DEBUG</button>
  </div>

  <section id="workshop" class="screen">
    <div class="ws">
      <div>
        <div class="stage">
          <div class="slots left" id="slotsL"></div>
          <div class="cv-wrap"><canvas id="wcv"></canvas><div class="stage-tag" id="stageTag">Workshop</div></div>
          <div class="slots right" id="slotsR"></div>
        </div>
        <div class="navbar">
          <button class="nbtn main" data-act="openDungeons"><span class="e">⛏</span>Dungeon</button>
          <button class="nbtn" data-act="openSummon"><span class="e">🔥</span>Summon <span class="badge hidden" id="tixBadge"></span></button>
          <button class="nbtn" data-act="openInventory"><span class="e">🎒</span>Inventory</button>
          <button class="nbtn" data-act="openUpgrade"><span class="e">⬆️</span>Upgrade</button>
          <button class="nbtn" data-act="openCraft"><span class="e">🛠</span>Craft</button>
          <button class="nbtn" data-act="openPresets"><span class="e">💾</span>Build Presets</button>
        </div>
      </div>
      <aside class="side">
        <div class="card" id="statsCard"></div>
        <div class="card" id="skillsCard"></div>
        <div class="card" id="questCard"></div>
      </aside>
    </div>
  </section>

  <section id="dungeon" class="hidden">
    <canvas id="dcv"></canvas>
    <div class="hud-top" id="hudTop">
      <div class="dname" id="hName">Dungeon</div>
      <div class="hp timer" id="hTimer">2:30</div>
      <div class="bagw">🎒 <div class="bar"><i id="hBagFill" style="width:0;background:var(--cyan)"></i></div><span id="hBag">0/0</span></div>
      <div class="hp" id="hValue">🪙 0</div>
      <div class="hp" id="hCount">⛏ 0</div>
      <div class="hp" id="hStats">P 0</div>
    </div>
    <div class="dbgbar hidden" id="dDbg">
      <button class="btn sm red" data-act="dbgSpeed">x1</button>
      <button class="btn sm red" data-act="dbgTime">+60s</button>
      <button class="btn sm red" data-act="dbgEnd">จบรอบ</button>
    </div>
    <div class="hud-bot" id="hudBot">
      <div class="hud-l">
        <button class="hbtn on" id="bAuto" data-act="toggleAuto">🤖 Auto: ON</button>
        <button class="hbtn" id="bMode" data-act="toggleMode">🎯 ใกล้สุด</button>
        <button class="hbtn ext" id="bExtract" data-act="extract">⇪ Extract</button>
      </div>
      <div class="hud-s">
        <button class="skill" id="sk0" data-act="skill" data-arg="0"><kbd>1</kbd><span class="ic">✋</span><span class="nm">-</span><span class="cdv"></span></button>
        <button class="skill" id="sk1" data-act="skill" data-arg="1"><kbd>2</kbd><span class="ic">✋</span><span class="nm">-</span><span class="cdv"></span></button>
      </div>
    </div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="mbox" id="mbox"><div class="mhead"><h2 id="mtitle"></h2><button class="x" data-act="closeModal">✕</button></div><div class="mbody" id="mbody"></div></div></div>
<div id="confirm" class="modal hidden"><div class="mbox narrow"><div class="mhead"><h2 id="ctitle">ยืนยัน</h2></div><div class="mbody"><div id="ctext" style="margin-bottom:14px"></div><div class="row2" style="justify-content:flex-end"><button class="btn" data-act="cNo">ยกเลิก</button><button class="btn pri" data-act="cYes" id="cYesBtn">ยืนยัน</button></div></div></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   BUILD A GOLEM — HTML5 Prototype (single file)
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

  presets:[{name:'Fast Mining',equip:null},{name:'Heavy Breaker',equip:null},{name:'Rare Ore Hunter',equip:null},{name:'Build 4',equip:null}],
  unlocked:{quarry:true,depths:false,rift:false},cleared:{},
  pity:{total:0,sinceRare:0,sinceLeg:0,sinceMyth:0,first5Rare:false},
  stats:{mined:0,summons:0,upgrades:0,extracts:0,earned:0,dismantles:0,crafts:0,runs:0,tier:[0,0,0,0,0,0,0],bestRar:0,maxLvl:1,maxP:0},
  quests:{active:[],ptr:0,cycle:0,done:[]},ach:[],settings:{sound:true,mode:'nearest',debug:false,runTime:150}};
 s.equip.head=addPart(s,'scrap_head');s.equip.core=addPart(s,'scrap_core');
 s.equip.armL=addPart(s,'scrap_arm');s.equip.armR=addPart(s,'scrap_arm');
 s.equip.legs=addPart(s,'scrap_legs');s.equip.back=addPart(s,'scrap_back');
 for(let i=0;i<3;i++)nextQuest(s);
 return s;
}
function load(){
 try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const d=JSON.parse(raw);const base=newState();
   const m=(a,b)=>{for(const k in a){if(b[k]===undefined)b[k]=a[k];else if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))m(a[k],b[k]);}return b;};
   S=m(base,d);S.inv=S.inv.filter(i=>PART[i.pid]);for(const sl of SLOTS)if(S.equip[sl]&&!invGet(S.equip[sl]))S.equip[sl]=null;return;}}catch(e){console.warn('load failed',e);}
 S=newState();
}
let saveT=0;
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,250);}

/* ========================= STATS ========================= */
function invGet(uid){return S.inv.find(i=>i.uid===uid)||null;}
function partStats(inst){const d=PART[inst.pid];const o={};for(const k in d.stats){const v=d.stats[k];o[k]=v>0?v*(1+0.02*(inst.lvl-1)):v;}return o;}
function fmtStat(k,v,sign){const s=sign&&v>=0?'+':'';if(k==='P'||k==='C')return s+Math.round(v);return s+(Math.round(v*10)/10).toFixed(1)+'%';}
function statLine(st,html=true){const n={P:'P',S:'S',M:'M',C:'C'};const parts=[];for(const k of['P','S','M','C'])if(st[k]!==undefined){const v=st[k];parts.push(html?`<span class="${v<0?'neg':''}">${n[k]} ${fmtStat(k,v,true)}</span>`:`${n[k]} ${fmtStat(k,v,true)}`);}return parts.join(' · ');}
function famCount(eq){const f=new Set();for(const sl of SLOTS){const i=eq[sl]&&invGet(eq[sl]);if(i)f.add(PART[i.pid].fam);}return f.size;}
function calcStats(eq){
 let P=10,Sp=100,M=100,C=20;const fx=new Set(),look={},parts={};
 for(const sl of SLOTS){const inst=eq[sl]?invGet(eq[sl]):null;if(!inst){look[sl]=null;continue;}
  look[sl]=inst.pid;parts[sl]=inst;const st=partStats(inst);P+=st.P||0;Sp+=st.S||0;M+=st.M||0;C+=st.C||0;fx.add(inst.pid);}
 const o={raw:{P,S:Sp,M,C},fx,look,parts};
 o.rawP=Math.max(10,P);o.P=Math.max(10,Math.round(P));
 o.S=Math.round(clamp(Sp,30,250)*10)/10;o.M=Math.round(clamp(M,40,200)*10)/10;o.C=clamp(Math.round(C),10,300);
 o.interval=clamp(1.2/(o.S/100),.35,2.5);o.move=2.4*o.M/100;
 o.maxTier=0;for(let t=1;t<=6;t++)if(o.P>=TIERS[t].req)o.maxTier=t;
 o.skills=['armL','armR'].map(sl=>{const pid=look[sl];if(!pid||!SKILLS[pid])return null;const sk=Object.assign({pid,fam:PART[pid].fam},SKILLS[pid]);
   let cd=sk.cd;if(sk.fam==='magma'&&fx.has('magma_back'))cd*=.9;if(sk.fam==='thunder'&&fx.has('thunder_back'))cd*=.9;sk.cdEff=Math.round(cd*10)/10;return sk;});
 return o;
}
function curStats(){const st=calcStats(S.equip);if(st.P>S.stats.maxP){S.stats.maxP=st.P;}return st;}

/* ========================= GACHA ========================= */
function rollRarity(rng,minRi){let pool=RAR.map((r,i)=>i).filter(i=>i>=minRi);const tot=pool.reduce((a,i)=>a+RAR[i].rate,0);let x=rng()*tot;for(const i of pool){x-=RAR[i].rate;if(x<0)return i;}return pool[pool.length-1];}
function summonOne(){
 const p=S.pity;const n=p.total+1;let ri=rollRarity(Math.random,0);let guar=null;
 if(p.sinceMyth+1>=150){ri=5;guar='Mythic';}
 else if(p.sinceLeg+1>=60&&ri<4){ri=rollRarity(Math.random,4);guar='Legendary+';}
 else if(n===5&&!p.first5Rare&&ri<2){ri=rollRarity(Math.random,2);guar='Rare+ (5 ครั้งแรก)';}
 else if(p.sinceRare+1>=10&&ri<2){ri=rollRarity(Math.random,2);guar='Rare+';}
 p.total=n;p.sinceRare=ri>=2?0:p.sinceRare+1;p.sinceLeg=ri>=4?0:p.sinceLeg+1;p.sinceMyth=ri>=5?0:p.sinceMyth+1;
 if(n<=5&&ri>=2)p.first5Rare=true;
 const pool=PART_LIST.filter(x=>x.ri===ri);const pd=pool[Math.floor(Math.random()*pool.length)];
 const uid=addPart(S,pd.id);S.stats.summons++;S.stats.bestRar=Math.max(S.stats.bestRar,ri);
 return{uid,pid:pd.id,ri,guar};
}

/* ========================= PART OPS ========================= */
function upCost(inst){const r=RAR[PART[inst.pid].ri];const nl=inst.lvl+1;return{coins:20*r.mult*nl*nl,scrap:nl<=3?0:Math.ceil(r.dis*.2*(nl-3))};}
function equippedSlot(uid){for(const sl of SLOTS)if(S.equip[sl]===uid)return sl;return null;}
function doEquip(slot,uid){const inst=invGet(uid);if(!inst)return false;if(PART[inst.pid].type!==SLOT_TYPE[slot]){toast('ชิ้นส่วนนี้ใส่ช่องนี้ไม่ได้','err');return false;}
 const other=equippedSlot(uid);if(other&&other!==slot){S.equip[other]=null;toast(`ย้าย ${PART[inst.pid].name} จาก ${SLOT_NAME[other].split(' ·')[0]}`);}
 S.equip[slot]=uid;wsAnim.pop=1;sfx('equip');afterChange();return true;}
function doUnequip(slot){S.equip[slot]=null;sfx('click');afterChange();}
function doUpgrade(uid){const inst=invGet(uid);if(!inst)return;if(inst.lvl>=10){toast('เลเวลสูงสุดแล้ว','err');return;}
 const c=upCost(inst);if(S.coins<c.coins){toast('Coins ไม่พอ','err');sfx('err');return;}if(S.scrap<c.scrap){toast('Ancient Scrap ไม่พอ','err');sfx('err');return;}
 S.coins-=c.coins;S.scrap-=c.scrap;inst.lvl++;S.stats.upgrades++;S.stats.maxLvl=Math.max(S.stats.maxLvl,inst.lvl);
 toast(`⬆ ${PART[inst.pid].name} → Lv.${inst.lvl}`,'ok');sfx('upgrade');if(equippedSlot(uid))wsAnim.pop=1;afterChange();}
function doDismantle(uid){const inst=invGet(uid);if(!inst)return false;if(equippedSlot(uid)){toast('ถอดชิ้นส่วนออกก่อนจึงจะย่อยได้','err');sfx('err');return false;}
 const v=RAR[PART[inst.pid].ri].dis;S.inv=S.inv.filter(i=>i.uid!==uid);S.scrap+=v;S.stats.dismantles++;toast(`♻ ย่อย ${PART[inst.pid].name} +${v} Scrap`,'ok');sfx('coin');afterChange();return true;}
function doCraft(pid){const c=RAR[PART[pid].ri].craft;if(S.scrap<c){toast('Ancient Scrap ไม่พอ','err');sfx('err');return;}S.scrap-=c;addPart(S,pid);S.stats.crafts++;S.stats.bestRar=Math.max(S.stats.bestRar,PART[pid].ri);toast(`🛠 คราฟต์ ${PART[pid].name} สำเร็จ`,'ok');sfx('upgrade');afterChange();}
function afterChange(){curStats();saveSoon();renderWorkshop();if(modalRefresh)modalRefresh();}

/* ========================= QUESTS ========================= */
function nextQuest(s){
 for(let guard=0;guard<QUESTS.length*2;guard++){
  const q=QUESTS[s.quests.ptr];s.quests.ptr++;if(s.quests.ptr>=QUESTS.length){s.quests.ptr=0;s.quests.cycle++;}
  if(q.once&&s.quests.done.includes(q.id))continue;if(s.quests.active.some(a=>a.id===q.id))continue;
  const cyc=q.once?0:s.quests.cycle;s.quests.active.push({id:q.id,start:q.stat?s.stats[q.stat]:0,cycle:cyc});return;}
}
function questInfo(a){const q=QUESTS.find(x=>x.id===a.id);if(!q)return null;const n=q.once?q.n:Math.round(q.n*(1+a.cycle*.6));
 const prog=q.abs?q.abs(S):S.stats[q.stat]-a.start;return{q,n,prog:Math.min(n,prog),done:prog>=n,text:q.text.replace('{n}',fmt(n))};}
function rwText(rw){const o=[];if(rw.tickets)o.push(`🎫${rw.tickets}`);if(rw.coins)o.push(`🪙${rw.coins}`);if(rw.scrap)o.push(`⚙️${rw.scrap}`);return o.join(' ');}
function claimQuest(i){const a=S.quests.active[i];const qi=a&&questInfo(a);if(!qi||!qi.done)return;const rw=qi.q.rw;
 S.tickets+=rw.tickets||0;S.coins+=rw.coins||0;S.scrap+=rw.scrap||0;if(qi.q.once)S.quests.done.push(qi.q.id);
 S.quests.active.splice(i,1);nextQuest(S);toast(`✅ รับรางวัล ${rwText(rw)}`,'gold');sfx('coin');afterChange();}
function claimAch(id){const a=ACH.find(x=>x.id===id);if(!a||S.ach.includes(id)||!a.ok(S))return;S.ach.push(id);S.tickets+=a.rw;toast(`🏆 ${a.text} +${a.rw} 🎫`,'gold');sfx('coin');afterChange();}

/* ========================= AUDIO ========================= */
let AC=null;
function sfx(k,v){if(!S||!S.settings.sound)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return;}
 const t=AC.currentTime;const tone=(f,d,type='sine',vol=.08,f2,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t+delay);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+delay+d);g.gain.setValueAtTime(vol,t+delay);g.gain.exponentialRampToValueAtTime(.0001,t+delay+d);o.connect(g);g.connect(AC.destination);o.start(t+delay);o.stop(t+delay+d+.02);};
 switch(k){
  case'hit':tone(180+(v||1)*40,.07,'square',.035,90);tone(900+(v||1)*120,.05,'triangle',.03);break;
  case'break':tone(520+(v||1)*80,.12,'triangle',.07);tone(780+(v||1)*100,.18,'sine',.06,null,.06);break;
  case'pick':tone(1200,.06,'sine',.05,1600);break;
  case'skill':tone(300,.3,'sawtooth',.05,900);tone(600,.25,'triangle',.05,1200,.05);break;
  case'equip':tone(440,.08,'triangle',.06);tone(660,.1,'triangle',.06,null,.07);break;
  case'upgrade':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',.06,null,i*.06));break;
  case'coin':tone(988,.08,'square',.04);tone(1319,.15,'square',.04,null,.07);break;
  case'err':tone(200,.15,'square',.05,120);break;
  case'click':tone(700,.04,'triangle',.04);break;
  case'summon':for(let i=0;i<=(v||0)+1;i++)tone(330*Math.pow(1.26,i),.18,'triangle',.06,null,i*.08);break;
  case'rock':tone(90,.4,'sawtooth',.08,40);break;
 }}

/* ========================= DRAW PRIMITIVES ========================= */
const OL='#141826';
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function poly(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,Math.PI*2);}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);}
function fs(c,fill,lw=2.2){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=OL;c.lineJoin='round';c.stroke();}}
function lg(c,y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function line(c,x0,y0,x1,y1,w,col){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.lineWidth=w;c.strokeStyle=col;c.lineCap='round';c.stroke();}
function glow(c,x,y,r,col,a=.6){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function eyes(c,y,col,sep=7,r=3){for(const s of[-1,1]){glow(c,s*sep,y,r*3,col,.5);circ(c,s*sep,y,r);c.fillStyle=col;c.fill();circ(c,s*sep-r*.35,y-r*.35,r*.35);c.fillStyle='#fff';c.fill();}}
function slits(c,y,col,sep=7,w=7){for(const s of[-1,1]){glow(c,s*sep,y,9,col,.45);rr(c,s*sep-w/2,y-1.5,w,3,1.5);c.fillStyle=col;c.fill();}}
function bolt(c,x0,y0,x1,y1,col,w=2,seg=5,jit=4){c.beginPath();c.moveTo(x0,y0);for(let i=1;i<seg;i++){const k=i/seg;c.lineTo(x0+(x1-x0)*k+(Math.random()-.5)*jit*2,y0+(y1-y0)*k+(Math.random()-.5)*jit*2);}c.lineTo(x1,y1);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke();}
function gear(c,x,y,r,teeth,rot,fill){c.beginPath();for(let i=0;i<teeth*2;i++){const a=rot+i*Math.PI/teeth;const rr2=i%2?r:r*1.28;c.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}c.closePath();fs(c,fill,1.6);circ(c,x,y,r*.35);fs(c,OL,0);}
function flame(c,x,y,s,t,col1,col2){const f=Math.sin(t*12+x)*.15;c.beginPath();c.moveTo(x-s*.5,y);c.quadraticCurveTo(x-s*.6,y-s*.8,x+f*s,y-s*1.6);c.quadraticCurveTo(x+s*.6,y-s*.8,x+s*.5,y);c.closePath();c.fillStyle=col1;c.fill();c.beginPath();c.moveTo(x-s*.25,y);c.quadraticCurveTo(x-s*.3,y-s*.5,x+f*s,y-s*.95);c.quadraticCurveTo(x+s*.3,y-s*.5,x+s*.25,y);c.closePath();c.fillStyle=col2;c.fill();}
function sprk(c,x,y,r,col){c.save();c.translate(x,y);c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;const q=i%2?r*.35:r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q);}c.closePath();c.fillStyle=col;c.fill();c.restore();}

/* ===== Golem rig ===== */
function armAngle(a,side,t,walk,ph){
 const out=side<0?1:-1;
 if(a.skill>0){const k=Math.sin(Math.min(1,a.skill/.5)*Math.PI);return out*(.2+k*2.2);}
 if(a.mine>=0&&(a.mineArm===side||a.mineArm===0)){const p=a.mine;const ang=p<.72?Math.sin(p/.72*Math.PI/2)*2.35:2.35-((p-.72)/.28)*2.75;return out*ang;}
 if(walk)return out*.12+Math.sin(ph+(side<0?0:Math.PI))*.45;
 return out*(.12+Math.sin(t*2.2+side)*.04);
}
function drawGolem(c,x,y,s,look,a){
 const t=a.t||0;c.save();c.translate(x,y);
 c.fillStyle='rgba(0,0,0,.30)';ell(c,0,0,36*s,9.5*s);c.fill();
 c.scale(s*(a.face||1),s);
 const walk=!!a.walk,ph=a.walkPh||0;const bob=walk?-Math.abs(Math.sin(ph))*3:Math.sin(t*2.2)*1.3;
 const hov=(look.legs==='zephyr_legs'||look.legs==='void_legs')?-5+Math.sin(t*3)*1.5:0;c.translate(0,hov);
 if(a.skill>0)glow(c,0,-58,85,a.skillCol||'#ffffff',.55*Math.min(1,a.skill/.3));
 if(a.charge)glow(c,0,-58,60,'#9ef0ff',.15+Math.random()*.1);
 const pop=1+(a.pop||0)*.14;
 c.save();c.translate(0,-56+bob);c.scale(pop,pop);drawPart(c,'back',look.back,t);c.restore();
 for(const side of[-1,1]){const lift=walk?Math.max(0,Math.sin(ph+(side<0?0:Math.PI)))*6:0;c.save();c.translate(13*side,-34+bob*.4-lift);if(side<0)c.scale(-1,1);drawPart(c,'legs',look.legs,t+(side<0?0:.37),side);c.restore();}
 c.save();c.translate(0,-56+bob);c.scale(pop,pop);drawPart(c,'core',look.core,t);c.restore();
 for(const side of[-1,1]){const sl=side<0?'armL':'armR';c.save();c.translate(30*side*pop,-67+bob);c.rotate(armAngle(a,side,t,walk,ph));if(side<0)c.scale(-1,1);drawPart(c,'arm',look[sl],t+(side<0?0:.5),side);c.restore();}
 c.save();c.translate(0,-93+bob*1.25);c.rotate(Math.sin(t*1.3)*.03);c.scale(pop,pop);drawPart(c,'head',look.head,t);c.restore();
 c.restore();
}

let summonAnim=null,lastSummon=[];
function openSummon(){
 const render=()=>{const p=S.pity;let h=`<div class="forge"><canvas id="scv" width="840" height="440"></canvas>
  <div class="row2" style="justify-content:center"><button class="btn gold" data-act="summon" data-arg="1" ${S.tickets>=1?'':'disabled'}>🔥 Summon x1 (🎫1)</button><button class="btn gold" data-act="summon" data-arg="10" ${S.tickets>=10?'':'disabled'}>🔥🔥 Summon x10 (🎫10)</button>

  <div class="pity">มีตั๋ว 🎫 <b style="color:var(--text)">${S.tickets}</b> · สุ่มแล้ว ${p.total} ครั้ง · การันตี Rare+ ใน ${10-p.sinceRare} · Legendary+ ใน ${60-p.sinceLeg} · Mythic ใน ${150-p.sinceMyth}${p.total<5&&!p.first5Rare?' · 5 ครั้งแรกการันตี Rare+':''}</div>

function fillSummonRes(){const box=$('#sres');if(!box)return;if(summonAnim&&summonAnim.t<summonAnim.dur){box.innerHTML='';return;}
 box.innerHTML=lastSummon.map((r,i)=>{const inst=invGet(r.uid);if(!inst)return'';const p=PART[r.pid];const slot=p.type==='arm'?'armL':p.type;const eq=equippedSlot(r.uid);
  return`<div class="pc" style="border-color:${rarCol(p.ri)};animation-delay:${i*.06}s;${p.ri>=3?`box-shadow:0 0 18px ${rgba(rarCol(p.ri),.45)}`:''}"><div class="top"><img src="${partIcon(p.id)}"><div><div class="rr" style="color:${rarCol(p.ri)}">${RAR[p.ri].name} ${r.guar?`<span class="guar">การันตี</span>`:''}</div><div class="nm">${esc(p.name)}</div><div class="sline">${TYPE_NAME[p.type]}</div></div></div>
  <div>${statLine(partStats(inst))}</div><div style="font-size:11px">${diffBlock(S.equip,withEquip(slot,r.uid)).replace('class="cmp"','class="cmp" style="padding:5px 7px;font-size:11px"')}</div>
  <div class="row2">${eq?`<span class="tag" style="color:var(--cyan)">ใส่แล้ว</span>`:p.type==='arm'?`<button class="btn sm pri" data-act="equipTo" data-arg="armL|${r.uid}">Equip L</button><button class="btn sm pri" data-act="equipTo" data-arg="armR|${r.uid}">Equip R</button>`:`<button class="btn sm pri" data-act="equipTo" data-arg="${slot}|${r.uid}">Equip</button>`}
  ${r.kept||eq?'':`<button class="btn sm" data-act="keep" data-arg="${i}">Keep</button>`}${r.kept?'<span class="hint">เก็บแล้ว ✓</span>':''}</div></div>`;}).join('');}
function doSummon(n){n=+n;if(S.tickets<n){toast('Part Tickets ไม่พอ','err');sfx('err');return;}if(summonAnim&&summonAnim.t<summonAnim.dur)return;
 S.tickets-=n;const res=[];for(let i=0;i<n;i++)res.push(summonOne());lastSummon=res;const best=Math.max(...res.map(r=>r.ri));
 summonAnim={t:0,dur:n>1?2.2:1.6,best,n};sfx('summon',best);curStats();saveSoon();renderWorkshop();if(modalRefresh)modalRefresh();}
function renderSummon(dt){const cv=$('#scv');if(!cv)return;const c=cv.getContext('2d');const W2=cv.width,H2=cv.height;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W2,H2);
 const a=summonAnim;const t=GT;const g=c.createLinearGradient(0,0,0,H2);g.addColorStop(0,'#141c33');g.addColorStop(1,'#0a0e1a');c.fillStyle=g;c.fillRect(0,0,W2,H2);
 let prog=1,col='#ff8a2a',shake=0;if(a){a.t+=dt;prog=clamp(a.t/a.dur,0,1);if(prog<.85){shake=prog*8;col=prog>.5?RAR[Math.min(a.best,Math.floor(prog*2.2*a.best/1.5))].color:'#ff8a2a';}else col=RAR[a.best].color;
  if(a.t>=a.dur&&!a.revealed){a.revealed=true;fillSummonRes();const sb=$('#skipBtn');if(sb)sb.disabled=true;if(a.best>=3)toast(`✨ ได้ ${RAR[a.best].name}!`,'gold');}}
 c.save();c.translate(W2/2+(Math.random()-.5)*shake,H2*.62+(Math.random()-.5)*shake);c.scale(2,2);
 glow(c,0,-30,120,col,.25+.2*Math.sin(t*4));
 // furnace
 poly(c,[-80,40,80,40,64,-50,-64,-50]);fs(c,lg(c,-50,40,'#5a4a62','#2a2236'),3);rr(c,-30,-110,22,62,3);fs(c,'#3a3046',2.5);
 rr(c,-46,-20,92,52,26);fs(c,'#160c10',3);glow(c,0,10,60,'#ff6a1a',.6+.15*Math.sin(t*9));for(let i=-2;i<=2;i++)flame(c,i*16,30,14+Math.sin(t*7+i)*3,t+i,'#ff6a1a','#ffd23f');
 for(let i=0;i<3;i++){const k=(t*.5+i/3)%1;circ(c,-19+Math.sin(k*5)*6,-112-k*40,6+k*8);c.fillStyle=`rgba(120,110,130,${.4*(1-k)})`;c.fill();}
 // capsule
 const cy=a?-40-Math.sin(clamp(prog/.85,0,1)*Math.PI)*10:-40;
 if(!a||prog<.85){circ(c,0,cy,22);fs(c,lg(c,cy-22,cy+22,mix('#ffffff',-.1),col.startsWith('#')?col:'#888'),3);line(c,-22,cy,22,cy,3,OL);glow(c,0,cy,40,col,.35);}
 else{const k=(prog-.85)/.15;for(let i=0;i<14;i++){const ang=i/14*Math.PI*2+t;c.strokeStyle=rgba(col,.6*(1-k*.5));c.lineWidth=4;c.beginPath();c.moveTo(Math.cos(ang)*20,cy+Math.sin(ang)*20);c.lineTo(Math.cos(ang)*(60+k*60),cy+Math.sin(ang)*(60+k*60));c.stroke();}
  glow(c,0,cy,90,col,.7);c.fillStyle='#fff';c.font='bold 16px Kanit,sans-serif';c.textAlign='center';c.fillText(RAR[a.best].name.toUpperCase()+'!',0,cy+5);}
 c.restore();
}

/* ========================= DUNGEON ========================= */
const W=22,H=14;const T_FLOOR=0,T_WALL=1,T_RUBBLE=2,T_SLOW=3,T_LAVA=4,T_SECRET=5;
let R=null;
function genDungeon(d,seed){
 const rng=mulberry32(seed);const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
 const g=new Uint8Array(W*H),deco=new Uint8Array(W*H),room=new Uint8Array(W*H);const I=(x,y)=>y*W+x;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x===0||y===0||x===W-1||y===H-1)g[I(x,y)]=T_WALL;
 const ent={x:1,y:ri(3,H-4)};const prot=(x,y)=>Math.abs(x-ent.x)<=2&&Math.abs(y-ent.y)<=2;
 let rm=null,secretIdx=-1;
 if(d.room&&(d.room==='bonus'||rng()<.65)){const top=rng()<.5;const rx0=W-7,ry0=top?1:H-6;rm={x0:rx0+1,y0:ry0+1,x1:W-2,y1:ry0+4};
  for(let y=ry0;y<=ry0+5;y++)for(let x=rx0;x<=W-1;x++){if(y<0||y>=H)continue;const inner=x>rx0&&x<W-1&&y>ry0&&y<ry0+5;room[I(x,y)]=inner?2:1;g[I(x,y)]=inner?T_FLOOR:T_WALL;}
  const sx=rx0,sy=ri(rm.y0,rm.y1);secretIdx=I(sx,sy);g[secretIdx]=T_SECRET;}
 const free=(x,y)=>x>0&&y>0&&x<W-1&&y<H-1&&!prot(x,y)&&!room[I(x,y)];
 const walk=(n,len,tile,onlyFloor)=>{for(let k=0;k<n;k++){let x=ri(3,W-4),y=ri(1,H-2);for(let s=0;s<len;s++){if(free(x,y)&&(!onlyFloor||g[I(x,y)]===T_FLOOR))g[I(x,y)]=tile;const dir=ri(0,3);x+=[1,-1,0,0][dir];y+=[0,0,1,-1][dir];x=clamp(x,1,W-2);y=clamp(y,1,H-2);}}};
 walk(ri(8,11),ri(4,7),T_WALL);
 for(let k=0;k<ri(5,9);k++){const x=ri(3,W-3),y=ri(1,H-2);if(free(x,y)&&g[I(x,y)]===T_FLOOR)g[I(x,y)]=T_RUBBLE;}
 if(d.hz.slow)walk(ri(2,3),ri(6,9),T_SLOW,true);if(d.hz.lava)walk(3,ri(7,11),T_LAVA,true);
 if(d.hz.rails){const ry=ri(2,H-3);for(let x=1;x<W-1;x++)if(g[I(x,ry)]===T_FLOOR&&!room[I(x,ry)])deco[I(x,ry)]=1;}
 // connectivity
 const seen=new Uint8Array(W*H);const q=[I(ent.x,ent.y)];seen[q[0]]=1;
 while(q.length){const i=q.shift();const x=i%W,y=(i/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const j=I(x+dx,y+dy);if(seen[j])continue;const tt=g[j];if(tt===T_WALL||tt===T_RUBBLE)continue;seen[j]=1;q.push(j);}}
 for(let i=0;i<W*H;i++)if(!seen[i]&&(g[i]===T_FLOOR||g[i]===T_SLOW||g[i]===T_LAVA)&&!room[i])g[i]=T_WALL;
 const ores=[];const oreAt=new Array(W*H).fill(null);
 const pickTier=()=>{let tot=d.wts.reduce((a,b)=>a+b,0),x=rng()*tot;for(let k=0;k<d.tiers.length;k++){x-=d.wts[k];if(x<0)return d.tiers[k];}return d.tiers[0];};
 const nearLava=(x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const j=I(x+dx,y+dy);if(g[j]===T_LAVA)return true;}return false;};
 const mk=(x,y,tier,extra={})=>{const T=TIERS[tier];const o=Object.assign({id:ores.length,x,y,tier,hp:T.hp,maxHp:T.hp,name:T.ores[Math.floor(rng()*2)][0],hidden:false,hot:nearLava(x,y),seed:rng(),hitT:0},extra);ores.push(o);oreAt[I(x,y)]=o;return o;};
 const cand=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=I(x,y);if(seen[i]&&!room[i]&&(g[i]===T_FLOOR||g[i]===T_SLOW)&&!prot(x,y))cand.push(i);}
 for(let i=cand.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]];}
 const n=Math.min(50,Math.floor(cand.length*.27));const top=d.tiers[d.tiers.length-1];
 for(let k=0;k<n;k++){const i=cand[k];mk(i%W,(i/W)|0,pickTier());}
 // hidden rare ores
 let hc=0;for(let k=n;k<cand.length&&hc<3;k++){const i=cand[k];const x=i%W,y=(i/W)|0;let adjWall=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(g[I(x+dx,y+dy)]===T_WALL)adjWall++;if(adjWall>=1){mk(x,y,top,{hidden:true});hc++;}}
 if(rm){for(let y=rm.y0;y<=rm.y1;y++)for(let x=rm.x0;x<=rm.x1;x++)if(rng()<.62)mk(x,y,rng()<.5?top:d.tiers[Math.max(0,d.tiers.length-2)]);
  const sx=secretIdx%W,sy=(secretIdx/W)|0;const o={id:ores.length,x:sx,y:sy,tier:0,hp:160,maxHp:160,name:d.room==='bonus'?'ผนังร้าว':'ผนังลับ',secret:true,revealed:d.room==='bonus',hidden:false,seed:rng(),hitT:0};ores.push(o);oreAt[secretIdx]=o;}
 return{g,deco,ent,ores,oreAt,room:rm,seed};
}
function startRun(did,seed){
 const d=DMAP[did];if(!S.unlocked[did]){toast('ยังไม่ปลดล็อก','err');return;}
 const st=calcStats(S.equip);seed=seed||Math.floor(Math.random()*1e9);const m=genDungeon(d,seed);
 R={d,seed,map:m,ores:m.ores,oreAt:m.oreAt,drops:[],st,fx:st.fx,skills:st.skills,
  g:{x:m.ent.x+.5,y:m.ent.y+.5,path:[],tgt:null,state:'idle',mineT:0,settle:0,face:1,walkPh:0,hits:0,stun:0,skill:0,skillCol:'#fff',mineArm:1,manual:false,idleWait:0,wasWalking:false,pathGoal:-1},
  bag:{items:{},w:0,res:0},time:S.settings.runTime,elapsed:0,mined:0,cds:[0,0],over:0,auto:true,mode:S.settings.mode,extracting:false,ended:false,
  parts:[],floats:[],efx:[],timers:[],rock:{next:14+Math.random()*8,warn:null},shield:st.fx.has('stoneguard_back'),lavaT:0,combo:{id:-1,n:0},capHits:0,blinkCd:0,flashCd:0,dashTiles:0,boost:0,msg:{},shake:0,speed:1,cam:{x:0,y:0},collectedCount:0,melted:0};
 closeModal();$('#workshop').classList.add('hidden');$('#dungeon').classList.remove('hidden');$('#hName').textContent='⛏ '+d.name;
 $('#dDbg').classList.toggle('hidden',!S.settings.debug);
 updateSkillButtons();updateHudButtons();resizeDungeon();sfx('equip');
 toast(`เข้าสู่ ${d.name}! ขุดได้ถึง Tier ${st.maxTier}`,'ok');
 return R;
}
function ix(x,y){return y*W+x;}
function lavaF(){return R.fx.has('frostbound_legs')?1:R.fx.has('frostbound_core')?.75:.5;}
function slowF(){return R.fx.has('zephyr_back')?.8:.55;}
function tileF(i){const t=R.map.g[i];return t===T_SLOW?slowF():t===T_LAVA?lavaF():1;}
function hasBlink(){return R.fx.has('void_legs');}
function walkable(i){if(i<0||i>=W*H)return false;if(R.oreAt[i])return false;const t=R.map.g[i];return t===T_FLOOR||t===T_SLOW||t===T_LAVA||(t===T_RUBBLE&&hasBlink());}
function stand(i){return walkable(i)&&R.map.g[i]!==T_RUBBLE;}
function dijkstra(src){const N=W*H;const dist=new Float32Array(N).fill(Infinity),prev=new Int16Array(N).fill(-1),done=new Uint8Array(N);dist[src]=0;
 const open=[src];while(open.length){let bi=0;for(let k=1;k<open.length;k++)if(dist[open[k]]<dist[open[bi]])bi=k;const u=open[bi];open[bi]=open[open.length-1];open.pop();if(done[u])continue;done[u]=1;
  const ux=u%W,uy=(u/W)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const vx=ux+dx,vy=uy+dy;if(vx<0||vy<0||vx>=W||vy>=H)continue;const v=ix(vx,vy);if(done[v]||!walkable(v))continue;
   if(dx&&dy&&(!walkable(ix(ux+dx,uy))||!walkable(ix(ux,uy+dy))))continue;const t=R.map.g[v];let cost=(dx&&dy?1.414:1)/tileF(v);if(t===T_LAVA)cost+=.8;if(t===T_RUBBLE)cost+=1.2;
   const nd=dist[u]+cost;if(nd<dist[v]){dist[v]=nd;prev[v]=u;open.push(v);}}}
 return{dist,prev};}
function pathTo(D,goal){const p=[];let c=goal;while(c!==-1&&D.prev[c]!==-1){p.push(c);c=D.prev[c];}return p.reverse();}
function gTile(){return ix(clamp(Math.floor(R.g.x),0,W-1),clamp(Math.floor(R.g.y),0,H-1));}
function gDist(x,y){return Math.hypot(R.g.x-(x+.5),R.g.y-(y+.5));}
function oreVisible(o){return !o.hidden&&(!o.secret||o.revealed);}
function canMine(o){return o.secret?true:R.st.P>=TIERS[o.tier].req;}
function oreW(o){return o.secret?0:TIERS[o.tier].w;}
function bagFits(tier){if(!tier)return true;const w=TIERS[tier].w;if(R.bag.w+w<=R.st.C)return true;if(R.fx.has('prism_back')&&tier>=5&&R.bag.res+w<=8)return true;return false;}
function bagAdd(name,tier){const w=TIERS[tier].w;if(R.bag.w+w<=R.st.C)R.bag.w+=w;else R.bag.res+=w;const it=R.bag.items[name]||(R.bag.items[name]={tier,count:0});it.count++;R.collectedCount++;}
function bagValue(){let v=0;for(const k in R.bag.items){const it=R.bag.items[k];v+=TIERS[it.tier].price*it.count;}return v;}
function oreValue(o){return o.secret?250:TIERS[o.tier].price;}
function notify(key,msg,type='',cd=3){const now=R.elapsed;if(R.msg[key]!==undefined&&now-R.msg[key]<cd)return;R.msg[key]=now;toast(msg,type);}
function bestStand(D,o){let best=-1,bd=Infinity;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=o.x+dx,y=o.y+dy;if(x<0||y<0||x>=W||y>=H)continue;const i=ix(x,y);
  if(dx&&dy){/* diagonal mining needs no corner rule */}if(!stand(i)&&i!==gTile())continue;if(D.dist[i]<bd){bd=D.dist[i];best=i;}}return{i:best,d:bd};}
function setTarget(tgt,manual){
 const g=R.g;const D=dijkstra(gTile());let goal;
 if(tgt.kind==='ore'){const o=tgt.o;if(gDist(o.x,o.y)<=1.55){g.tgt=tgt;g.path=[];g.state='mine';g.settle=settleTime();g.manual=manual;return true;}const b=bestStand(D,o);if(b.i<0||b.d===Infinity)return false;goal=b.i;}
 else if(tgt.kind==='drop'){goal=ix(Math.floor(tgt.d.x),Math.floor(tgt.d.y));if(D.dist[goal]===Infinity){const o={x:Math.floor(tgt.d.x),y:Math.floor(tgt.d.y)};const b=bestStand(D,o);if(b.i<0||b.d===Infinity)return false;goal=b.i;}}
 else{goal=tgt.i;if(D.dist[goal]===Infinity)return false;}
 const path=pathTo(D,goal);g.tgt=tgt;g.path=path;g.pathGoal=goal;g.manual=manual;g.state=path.length?'walk':(tgt.kind==='ore'?'mine':'idle');g.settle=settleTime();
 if(path.length&&tgt.kind==='ore'&&R.fx.has('thunder_legs')&&R.flashCd<=0){R.boost=.6;R.flashCd=10;for(let k=0;k<10;k++)part(g.x,g.y,'#9ef0ff',3,2);}
 return true;}
function settleTime(){return R.fx.has('drilltech_legs')?0:R.fx.has('scrap_legs')?.1:.3;}
function chooseTarget(){
 const g=R.g;const D=dijkstra(gTile());const spd=R.st.move;let best=null,bs=-Infinity;let anyMineable=false,fullBlock=false;
 for(const dr of R.drops){if(dr.fly)continue;if(!bagFits(dr.tier)){fullBlock=true;continue;}const i=ix(Math.floor(dr.x),Math.floor(dr.y));let dd=D.dist[i];if(dd===Infinity){const b=bestStand(D,{x:Math.floor(dr.x),y:Math.floor(dr.y)});dd=b.d;}if(dd===Infinity)continue;
  const sc=R.mode==='nearest'?-dd+.5:TIERS[dr.tier].price/(dd/spd+.3);if(sc>bs){bs=sc;best={kind:'drop',d:dr};}}
 for(const o of R.ores){if(!oreVisible(o)||!canMine(o))continue;anyMineable=true;if(!bagFits(o.tier)&&!o.secret){fullBlock=true;continue;}
  const near=gDist(o.x,o.y)<=1.55;const dd=near?0:bestStand(D,o).d;if(dd===Infinity)continue;
  const mineT=Math.ceil(o.hp/R.st.rawP)*R.st.interval;const sc=R.mode==='nearest'?-dd:oreValue(o)/(dd/spd+mineT+.5);if(sc>bs){bs=sc;best={kind:'ore',o};}}
 if(best){setTarget(best,false);return true;}
 if(fullBlock){notify('full','🎒 กระเป๋าเต็ม! กด Extract เพื่อกลับฐานขายแร่','err',6);$('#bExtract').classList.add('pulse');}
 else if(!anyMineable)notify('none','ไม่มีแร่ที่ขุดได้เหลือแล้ว — กด Extract','',8);
 g.idleWait=.6;return false;}
function damageOre(o,amt,src){
 if(!o||R.ores.indexOf(o)<0)return 0;
 if(o.hidden){o.hidden=false;floatTxt(o.x+.5,o.y+.2,'พบแร่ซ่อน!','#fff6a8');return 0;}
 if(o.secret&&!o.revealed){o.revealed=true;floatTxt(o.x+.5,o.y+.2,'พบผนังลับ!','#ff9df0');}
 if(!canMine(o)){floatTxt(o.x+.5,o.y+.3,'Power ไม่พอ','#ff8a95');return 0;}
 let m=1;const t=o.tier;
 if(!o.secret){if(R.fx.has('stoneguard_head')&&t<=2)m*=1.1;if(R.fx.has('titanstone_head')&&t>=3)m*=1.1;if(o.hot&&R.fx.has('frostbound_head'))m*=1.15;if(o.hot&&R.fx.has('magma_head'))m*=1.2;}
 let crit=false;if(R.fx.has('drilltech_head')&&Math.random()<.15){m*=1.5;crit=true;}
 const dmg=amt*m;o.hp-=dmg;o.hitT=.15;const ti=o.secret?null:ORE_INFO[o.name];
 floatTxt(o.x+.5+(Math.random()-.5)*.3,o.y+.1,(crit?'💥':'')+Math.round(dmg),crit?'#ffd84a':'#ffffff',crit?1.25:1);
 for(let k=0;k<5;k++)part(o.x+.5,o.y+.5,ti?ti.c1:'#bbb',2.5,3);
 if(o.hp<=0)breakOre(o);return dmg;}
function breakOre(o){
 const i=ix(o.x,o.y);R.ores.splice(R.ores.indexOf(o),1);R.oreAt[i]=null;
 if(o.secret){R.map.g[i]=T_FLOOR;toast(o.name==='ผนังร้าว'?'🧱 ทะลวงเข้าห้องแร่โบนัส!':'✨ พบห้องลับ!','gold');for(let k=0;k<30;k++)part(o.x+.5,o.y+.5,'#ff9df0',5,4);sfx('break',4);R.shake=.3;return;}
 R.mined++;S.stats.mined++;S.stats.tier[o.tier]++;const info=ORE_INFO[o.name];
 for(let k=0;k<16+o.tier*3;k++)part(o.x+.5,o.y+.5,k%2?info.c1:info.c2,4+o.tier*.4,5);R.efx.push({type:'ring',x:o.x+.5,y:o.y+.5,r:1,t:0,dur:.35,col:info.c1});
 sfx('break',o.tier);R.drops.push({x:o.x+.5,y:o.y+.5,tier:o.tier,name:o.name,t:0,fly:false,vy:-2});
 if(R.g.tgt&&R.g.tgt.o===o){R.g.tgt=null;R.g.state='idle';R.g.idleWait=.05;}}
function pickupR(){let r=1.6;if(R.fx.has('coppergear_back'))r+=1.5;if(R.fx.has('magnetite_core'))r+=.6;if(R.fx.has('magnetite_legs')&&R.g.state==='walk')r+=1;return r;}
function updDrops(dt){const g=R.g;const pr=pickupR();
 for(let k=R.drops.length-1;k>=0;k--){const d=R.drops[k];d.t+=dt;
  if(d.fly){const dx=g.x-d.x,dy=g.y-d.y,l=Math.hypot(dx,dy);if(l<.35){if(bagFits(d.tier)){bagAdd(d.name,d.tier);floatTxt(g.x,g.y-1.2,'+'+d.name,ORE_INFO[d.name].c1,.9);sfx('pick');R.drops.splice(k,1);}else{d.fly=false;}continue;}
   const sp=Math.min(l,14*dt);d.x+=dx/l*sp;d.y+=dy/l*sp;continue;}
  const dist=Math.hypot(g.x-d.x,g.y-d.y);if(dist<=pr&&d.t>.25&&bagFits(d.tier))d.fly=true;}}
function useSkill(i){
 if(!R||R.ended)return;const sk=R.skills[i];if(!sk){notify('nosk'+i,`ไม่มีแขนในช่องสกิล ${i+1}`,'err');sfx('err');return;}
 if(R.cds[i]>0){notify('cd'+i,`${sk.name} ยังติดคูลดาวน์ (${Math.ceil(R.cds[i])} วิ)`,'err',1);sfx('err');return;}
 if(R.g.stun>0){notify('stun','โกเลมมึนงงอยู่!','err',1);return;}
 const ok=SKILL_FX[sk.type](sk);if(ok===false){sfx('err');return;}

 const top=$('#hudTop').offsetHeight,bot=$('#hudBot').offsetHeight;const aw=w-16,ah=h-top-bot-10;let T=clamp(Math.min(aw/W,(ah)/(H+.6)),26,72);if(aw/W<26)T=clamp(Math.min(ah/(H+.6),40),26,40);DV={T,w,h,top,bot,dpr,aw,ah};}
function camUpdate(){const T=DV.T;const ww=W*T,wh=(H+.6)*T;const vx=DV.w,vy=DV.h-DV.top-DV.bot;let ox,oy;
 if(ww<=vx)ox=(vx-ww)/2;else ox=clamp(vx/2-R.g.x*T,vx-ww-8,8);if(wh<=vy)oy=DV.top+(vy-wh)/2+.6*T;else oy=DV.top+clamp(vy/2-R.g.y*T,vy-wh,0)+.6*T;
 R.cam.x+=(ox-R.cam.x)*(R.cam.init?.15:1);R.cam.y+=(oy-R.cam.y)*(R.cam.init?.15:1);R.cam.init=true;}
function dungeonClick(ev){
 if(!R||R.ended)return;const rect=$('#dcv').getBoundingClientRect();const px=ev.clientX-rect.left,py=ev.clientY-rect.top;if(py<DV.top||py>DV.h-DV.bot)return;
 const wx=(px-R.cam.x)/DV.T,wy=(py-R.cam.y)/DV.T;
 // drops first
 let bestD=null,bd=.6;for(const d of R.drops){const dd=Math.hypot(d.x-wx,d.y-wy);if(dd<bd){bd=dd;bestD=d;}}
 // ores (allow clicking slightly above since crystals are tall)
 let o=null,bo=.85;for(const x of R.ores){if(!oreVisible(x))continue;const dd=Math.hypot(x.x+.5-wx,x.y+.35-wy);if(dd<bo){bo=dd;o=x;}}
 if(R.extracting){R.extracting=false;$('#bExtract').classList.remove('going');toast('ยกเลิกการกลับฐาน');}
 if(o){if(!canMine(o)){toast('Mining Power ไม่เพียงพอ','err');sfx('err');floatTxt(o.x+.5,o.y,`ต้องการ P ${TIERS[o.tier].req}`,'#ff8a95');return;}
  if(!o.secret&&!bagFits(o.tier)){toast('🎒 กระเป๋าเต็ม — เก็บแร่ก้อนนี้ไม่ได้','err');sfx('err');return;}
  if(R.g.stun>0){toast('โกเลมมึนงงอยู่','err');return;}
  if(setTarget({kind:'ore',o},true)){R.efx.push({type:'ring',x:o.x+.5,y:o.y+.5,r:.7,t:0,dur:.3,col:'#3fe0ff'});sfx('click');}else{toast('เดินไปไม่ถึงแร่ก้อนนี้','err');}return;}
 if(bestD){setTarget({kind:'drop',d:bestD},true);sfx('click');return;}
 const tx=Math.floor(wx),ty=Math.floor(wy);if(tx<0||ty<0||tx>=W||ty>=H)return;const i=ix(tx,ty);
 if(stand(i)){if(R.g.stun>0)return;if(setTarget({kind:'move',i},true)){R.efx.push({type:'ring',x:tx+.5,y:ty+.5,r:.5,t:0,dur:.3,col:'#52e08a'});sfx('click');}else toast('เดินไปตรงนั้นไม่ได้','err');}
}

function renderDungeon(){
 const cv=$('#dcv');const c=cv.getContext('2d');const T=DV.T;c.setTransform(DV.dpr,0,0,DV.dpr,0,0);const th=R.d.th1;c.fillStyle=th.bg;c.fillRect(0,0,DV.w,DV.h);
 camUpdate();c.save();let sx=0,sy=0;if(R.shake>0){sx=(Math.random()-.5)*R.shake*16;sy=(Math.random()-.5)*R.shake*16;}c.translate(R.cam.x+sx,R.cam.y+sy);
 const t=GT;const g=R.map.g;const wh=T*.42;
 // floors
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=ix(x,y);const tt=g[i];if(tt===T_WALL||tt===T_SECRET)continue;const X=x*T,Y=y*T;
  c.fillStyle=(x+y)%2?th.floor:th.floor2;c.fillRect(X,Y,T+.5,T+.5);
  if(tt===T_SLOW){c.fillStyle=R.d.id==='rift'?'rgba(150,60,220,.38)':'rgba(70,120,60,.45)';rr(c,X+2,Y+2,T-4,T-4,T*.3);c.fill();c.fillStyle='rgba(255,255,255,.12)';circ(c,X+T*.3+Math.sin(t*2+x)*2,Y+T*.4,T*.08);c.fill();}
  if(tt===T_LAVA){const k=.5+.5*Math.sin(t*2.5+x*.7+y);c.fillStyle=`rgb(${200+k*55|0},${70+k*50|0},20)`;c.fillRect(X,Y,T+.5,T+.5);c.fillStyle='rgba(255,230,120,.5)';circ(c,X+T*(.3+.4*((x*7+y*3)%5)/5),Y+T*.5+Math.sin(t*3+x)*T*.1,T*.09);c.fill();}
  if(R.map.deco[i]){c.strokeStyle='rgba(160,140,110,.55)';c.lineWidth=2;c.beginPath();c.moveTo(X,Y+T*.35);c.lineTo(X+T,Y+T*.35);c.moveTo(X,Y+T*.65);c.lineTo(X+T,Y+T*.65);c.stroke();c.fillStyle='rgba(110,80,50,.7)';for(let k=0;k<3;k++)c.fillRect(X+k*T/3+2,Y+T*.28,3,T*.44);}
  if(R.map.room&&x>=R.map.room.x0&&x<=R.map.room.x1&&y>=R.map.room.y0&&y<=R.map.room.y1){c.fillStyle=rgba(th.acc,.08);c.fillRect(X,Y,T,T);}}
 // exit portal
 const ex=(R.map.ent.x+.5)*T,ey=(R.map.ent.y+.5)*T;glow(c,ex,ey,T*1.1,th.acc,.5+.15*Math.sin(t*3));c.strokeStyle=th.acc;c.lineWidth=3;ell(c,ex,ey,T*.42,T*.24);c.stroke();ell(c,ex,ey,T*.28+Math.sin(t*4)*2,T*.15);c.stroke();
 c.fillStyle='#fff';c.font=`bold ${Math.max(9,T*.22)}px Kanit,sans-serif`;c.textAlign='center';c.fillText('EXIT',ex,ey-T*.35);
 // rockfall warning
 if(R.rock.warn){const w=R.rock.warn;const k=1-w.t/w.dur;c.fillStyle=`rgba(255,60,60,${.18+.25*Math.abs(Math.sin(t*12))})`;circ(c,w.x*T,w.y*T,T*1.2);c.fill();c.strokeStyle='rgba(255,90,90,.9)';c.lineWidth=2;circ(c,w.x*T,w.y*T,T*1.2*(1-k*.3));c.stroke();
  for(let n=0;n<3;n++){c.fillStyle='#6b5a48';circ(c,w.x*T+(n-1)*T*.4,w.y*T-T*3*(1-k)-n*T*.3,T*.16);c.fill();}}
 // target path / arrow
 const gx=R.g.x*T,gy=R.g.y*T;
 if(R.g.tgt&&R.g.path.length){if(R.fx.has('thunder_head')){c.strokeStyle='rgba(158,240,255,.75)';c.setLineDash([6,6]);c.lineDashOffset=-t*30;c.lineWidth=2.5;c.beginPath();c.moveTo(gx,gy);for(const p of R.g.path)c.lineTo((p%W+.5)*T,(((p/W)|0)+.5)*T);c.stroke();c.setLineDash([]);}}
 // depth-sorted rows
 const ents=[];for(const o of R.ores)ents.push({y:o.y+.5,k:'o',o});for(const d of R.drops)ents.push({y:d.y,k:'d',d});ents.push({y:R.g.y,k:'g'});ents.sort((a,b)=>a.y-b.y);let ei=0;
 for(let y=0;y<H;y++){
  while(ei<ents.length&&ents[ei].y<y){drawEnt(c,ents[ei],T,t);ei++;}
  for(let x=0;x<W;x++){const i=ix(x,y);const tt=g[i];const X=x*T,Y=y*T;
   if(tt===T_WALL||(tt===T_SECRET&&!(R.oreAt[i]&&R.oreAt[i].revealed))){const below=y<H-1?g[ix(x,y+1)]:T_WALL;const fb=below===T_WALL||below===T_SECRET;
    if(!fb){c.fillStyle='rgba(0,0,0,.35)';c.fillRect(X,Y+T,T+.5,T*.18);}
    c.fillStyle=fb?th.top:th.wall;c.fillRect(X,Y+T-wh,T+.5,wh+.5);if(!fb){c.fillStyle='rgba(0,0,0,.18)';c.fillRect(X,Y+T-wh*.35,T+.5,wh*.35);}

    c.fillStyle='rgba(255,255,255,.08)';c.fillRect(X,Y-wh,T,2);if(R.d.id==='quarry'&&(x*13+y*7)%5===0){c.fillStyle=rgba(th.acc,.75);poly(c,[X+T*.3,Y-wh+T*.4,X+T*.4,Y-wh+T*.05,X+T*.5,Y-wh+T*.4]);c.fill();}
    if(R.d.id==='rift'&&(x*11+y*5)%7===0){c.fillStyle=rgba(th.acc,.5+.3*Math.sin(t*2+x));c.fillRect(X+T*.45,Y-wh+T*.12,T*.1,T*.3);}}
   else if(tt===T_SECRET){const o=R.oreAt[i];c.fillStyle=mix(th.wall,-.2);c.fillRect(X,Y+T-wh,T+.5,wh+.5);c.fillStyle=mix(th.top,-.08);c.fillRect(X,Y-wh,T+.5,T+.5);c.strokeStyle=`rgba(255,157,240,${.6+.3*Math.sin(t*4)})`;c.lineWidth=2;c.beginPath();c.moveTo(X+T*.3,Y-wh+3);c.lineTo(X+T*.5,Y);c.lineTo(X+T*.35,Y+T*.4);c.moveTo(X+T*.5,Y);c.lineTo(X+T*.75,Y+T*.2);c.stroke();
    glow(c,X+T/2,Y,T*.7,'#ff9df0',.25);if(o)hpBar(c,o,X+T/2,Y-wh-6,T);}
   else if(tt===T_RUBBLE){for(let k=0;k<3;k++){c.fillStyle=mix(th.wall,k*.1-.1);ell(c,X+T*(.3+k*.2),Y+T*(.6-((k*7)%3)*.08),T*.17,T*.12);c.fill();c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1;c.stroke();}}}
 }
 while(ei<ents.length){drawEnt(c,ents[ei],T,t);ei++;}
 // effects
 for(const e of R.efx){const k=e.t/e.dur;c.globalAlpha=1-k;
  if(e.type==='ring'){const r=e.inward?e.r*T*(1-k):e.r*T*(.3+k*.7);if(e.fill){c.fillStyle=rgba(e.col,.25);circ(c,e.x*T,e.y*T,r);c.fill();}c.strokeStyle=e.col;c.lineWidth=3;circ(c,e.x*T,e.y*T,Math.max(1,r));c.stroke();}
  if(e.type==='burst'){glow(c,e.x*T,e.y*T,T*e.r*(.5+k),e.col,.8);for(let n=0;n<8;n++){const a=n*Math.PI/4;line(c,e.x*T+Math.cos(a)*T*.3*k,e.y*T+Math.sin(a)*T*.3*k,e.x*T+Math.cos(a)*T*(.4+.6*k),e.y*T+Math.sin(a)*T*(.4+.6*k),3,e.col);}}
  if(e.type==='spin'){c.save();c.translate(e.x*T,e.y*T);c.rotate(k*6);for(let n=0;n<3;n++){c.rotate(Math.PI*2/3);line(c,0,0,T*.5,0,3,e.col);}c.restore();}
  if(e.type==='beam'){line(c,e.x0*T,e.y0*T,e.x1*T,e.y1*T,6*(1-k)+1,e.col);glow(c,e.x1*T,e.y1*T,T*.6,e.col,.7);}
  if(e.type==='bolt'){bolt(c,e.x0*T,e.y0*T,e.x1*T,e.y1*T,e.col,3,7,T*.15);bolt(c,e.x0*T,e.y0*T,e.x1*T,e.y1*T,'#ffffff',1.2,7,T*.1);glow(c,e.x1*T,e.y1*T,T*.7,e.col,.7);}
  if(e.type==='slice'){line(c,e.x0*T,e.y0*T,e.x1*T,e.y1*T,14*(1-k)+2,rgba(e.col,.6));line(c,e.x0*T,e.y0*T,e.x1*T,e.y1*T,4*(1-k)+1,'#ffffff');}

 // target arrow (Gale Finder) and marker
 const tg=R.g.tgt;if(tg&&(tg.kind==='ore'||tg.kind==='drop')){const tx=tg.kind==='ore'?(tg.o.x+.5)*T:tg.d.x*T,ty=tg.kind==='ore'?(tg.o.y+.5)*T:tg.d.y*T;
  c.strokeStyle=R.g.manual?'#52e08a':'rgba(63,224,255,.8)';c.lineWidth=2;c.setLineDash([4,4]);circ(c,tx,ty,T*.55+Math.sin(t*6)*2);c.stroke();c.setLineDash([]);
  if(R.fx.has('zephyr_head')){const a=Math.atan2(ty-gy,tx-gx);c.save();c.translate(gx+Math.cos(a)*T*.9,gy-T*.5+Math.sin(a)*T*.9);c.rotate(a);poly(c,[T*.25,0,-T*.12,-T*.15,-T*.05,0,-T*.12,T*.15]);c.fillStyle='#5ad1c6';c.fill();c.strokeStyle=OL;c.lineWidth=1.5;c.stroke();c.restore();}}
 // floats

 const mine=canMine(o);const fs2=Math.max(9,T*.22);
 if(!mine){c.fillStyle='rgba(0,0,0,.55)';rr(c,X-T*.22,Y-T*.62,T*.44,T*.26,4);c.fill();c.fillStyle='#ff8a95';c.font=`700 ${fs2}px Kanit,sans-serif`;c.textAlign='center';c.fillText('🔒T'+o.tier,X,Y-T*.43);}
 else if(R.fx.has('prism_core')){c.font=`700 ${fs2}px Kanit,sans-serif`;c.textAlign='center';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.75)';const s2=`T${o.tier} 🪙${TIERS[o.tier].price}`;c.strokeText(s2,X,Y-T*.5);c.fillStyle=info.c1;c.fillText(s2,X,Y-T*.5);}
 hpBar(c,o,X,Y-T*.72,T);
}

/* ========================= WORKSHOP CANVAS ========================= */
let WV={w:0,h:0,dpr:1};
function resizeWorkshop(){const cv=$('#wcv');const r=cv.parentElement.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);WV={w:r.width,h:r.height,dpr};}
function renderWorkshopCanvas(dt){
 const cv=$('#wcv');if(!WV.w)return;const c=cv.getContext('2d');c.setTransform(WV.dpr,0,0,WV.dpr,0,0);const w=WV.w,h=WV.h;c.clearRect(0,0,w,h);const t=GT;
 // backdrop gears
 c.save();c.globalAlpha=.08;gear(c,w*.12,h*.2,28,10,t*.2,'#8fa2c8');gear(c,w*.88,h*.3,22,9,-t*.25,'#8fa2c8');gear(c,w*.8,h*.12,12,7,t*.4,'#8fa2c8');c.restore();
 // pedestal
 const cx=w/2,cy=h*.84;glow(c,cx,cy-h*.3,Math.min(w,h)*.55,'#3fe0ff',.12);
 c.fillStyle='#1c2a4a';ell(c,cx,cy+8,Math.min(w*.4,170),26);c.fill();c.fillStyle='#24375f';ell(c,cx,cy,Math.min(w*.4,170),24);c.fill();c.strokeStyle=rgba('#3fe0ff',.5+.2*Math.sin(t*2));c.lineWidth=2;ell(c,cx,cy,Math.min(w*.36,150),19);c.stroke();
 // demo mining swing
 wsAnim.demoT-=dt;if(wsAnim.demoT<=0){if(wsAnim.mine<0){wsAnim.mine=0;wsAnim.mineArm=Math.random()<.5?-1:1;}}
 if(wsAnim.mine>=0){wsAnim.mine+=dt*1.4;if(wsAnim.mine>=1){wsAnim.mine=-1;wsAnim.demoT=3+Math.random()*3;for(let k=0;k<8;k++)wsParts.push({x:cx+wsAnim.mineArm*h*.25,y:cy-6,vx:(Math.random()-.5)*120,vy:-Math.random()*120,l:.6});}}
 wsAnim.pop=Math.max(0,wsAnim.pop-dt*3);
 const s=Math.min(h*.7/130,w*.8/110);const st=calcStats(S.equip);
 drawGolem(c,cx,cy,s,st.look,{t,mine:wsAnim.mine,mineArm:wsAnim.mineArm||1,pop:wsAnim.pop,face:1});
 for(let k=wsParts.length-1;k>=0;k--){const p=wsParts[k];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;if(p.l<=0){wsParts.splice(k,1);continue;}c.fillStyle=rgba('#ffd36b',p.l/.6);c.fillRect(p.x,p.y,4,4);}
}
const wsParts=[];

/* ========================= EVENTS ========================= */
const ACT={
 closeModal,openSettings,openDebug,openDungeons,openSummon,openInventory,openUpgrade,openCraft,openPresets,
 openSlot:a=>openSlot(a),openPart:a=>openPart(a),
 equipTo:a=>{const[sl,uid]=a.split('|');doEquip(sl,uid);},unequip:a=>doUnequip(a),upgrade:a=>doUpgrade(a),
 dismantle:a=>{const inst=invGet(a);if(!inst)return;const p=PART[inst.pid];if(equippedSlot(a)){toast('ถอดชิ้นส่วนออกก่อนจึงจะย่อยได้','err');return;}
  confirmBox(`ย่อย <b style="color:${rarCol(p.ri)}">${esc(p.name)}</b> Lv.${inst.lvl} เป็น <b>${RAR[p.ri].dis} Ancient Scrap</b>?<br><span class="hint">ไม่สามารถย้อนกลับได้</span>`,()=>{doDismantle(a);if(!invGet(a))closeModal();},'♻ ย่อย');},
 bulkDis:()=>{const protect=new Set();S.presets.forEach(p=>{if(p.equip)Object.values(p.equip).forEach(u=>u&&protect.add(u));});const byPid={};
  S.inv.forEach(i=>{(byPid[i.pid]=byPid[i.pid]||[]).push(i);});const list=[];for(const pid in byPid){if(PART[pid].ri>2)continue;const arr=byPid[pid].sort((a,b)=>b.lvl-a.lvl);let kept=0;
   for(const i of arr){if(equippedSlot(i.uid)||protect.has(i.uid)||kept<2){kept++;continue;}list.push(i);}}
  if(!list.length){toast('ไม่มีชิ้นซ้ำให้ย่อย (เก็บไว้ 2 ชิ้นต่อแบบ)');return;}const tot=list.reduce((a,i)=>a+RAR[PART[i.pid].ri].dis,0);
  confirmBox(`ย่อยชิ้นซ้ำ (Common–Rare) ${list.length} ชิ้น ได้ <b>${tot} Scrap</b><br><span class="hint">เก็บไว้อย่างน้อย 2 ชิ้นต่อแบบ ไม่แตะชิ้นที่ใส่อยู่หรืออยู่ใน Preset</span>`,()=>{list.forEach(i=>{S.inv=S.inv.filter(x=>x.uid!==i.uid);S.scrap+=RAR[PART[i.pid].ri].dis;S.stats.dismantles++;});toast(`♻ ได้ ${tot} Scrap`,'ok');sfx('coin');afterChange();},'♻ ย่อยทั้งหมด');},
 craft:a=>doCraft(a),summon:a=>doSummon(a),skipSummon:()=>{if(summonAnim)summonAnim.t=summonAnim.dur;},
 keep:a=>{const r=lastSummon[+a];if(r){r.kept=true;fillSummonRes();}},
 savePreset:a=>savePreset(+a),loadPreset:a=>loadPreset(+a),
 enterDungeon:a=>startRun(a),unlockDungeon:a=>unlockDungeon(a),
 claimQuest:a=>claimQuest(+a),claimAch:a=>claimAch(a),qtab:a=>{qTab=a;renderQuests();},
 toggleSound:()=>{S.settings.sound=!S.settings.sound;saveSoon();renderWorkshop();if(modalRefresh)modalRefresh();},
 toggleDebug:()=>{S.settings.debug=!S.settings.debug;saveSoon();renderWorkshop();if(modalRefresh)modalRefresh();toast(S.settings.debug?'🐞 Debug Mode เปิด':'Debug Mode ปิด');},
 resetSave:()=>confirmBox('ลบข้อมูลเกมทั้งหมดและเริ่มใหม่?<br><span class="hint">Coins, ชิ้นส่วน, Presets, เควสต์ จะหายทั้งหมด</span>',()=>{localStorage.removeItem(SAVE_KEY);S=newState();save();closeModal();renderWorkshop();toast('เริ่มเกมใหม่แล้ว','ok');},'🗑 Reset','Reset Save'),
 dbg:a=>debugAct(a),
 cYes:()=>{$('#confirm').classList.add('hidden');const cb=confirmCb;confirmCb=null;cb&&cb();},cNo:()=>{$('#confirm').classList.add('hidden');confirmCb=null;},
 skill:a=>useSkill(+a),
 toggleAuto:()=>{if(!R)return;R.auto=!R.auto;if(!R.auto&&!R.g.manual&&R.g.state!=='mine'){R.g.path=[];R.g.state='idle';R.g.tgt=null;}updateHudButtons();toast(R.auto?'🤖 Auto Mining: ON':'🕹 Auto OFF — แตะแร่/พื้นเพื่อสั่งงาน');},
 toggleMode:()=>{if(!R)return;R.mode=R.mode==='nearest'?'valuable':'nearest';updateHudButtons();toast(R.mode==='nearest'?'🎯 โหมด Nearest: แร่ที่ไปถึงเร็วที่สุด':'💎 โหมด Valuable: แร่มูลค่าสูงคุ้มเวลา');if(!R.g.manual&&R.g.state==='walk'){R.g.state='idle';R.g.idleWait=0;}},
 extract:()=>{if(!R||R.ended)return;R.extracting=!R.extracting;if(!R.extracting){R.g.tgt=null;R.g.state='idle';R.g.path=[];}else{R.g.tgt=null;R.g.state='idle';toast('↩ กำลังเดินกลับประตูทางออก…');}updateHudButtons();},
 dbgSpeed:(a,b)=>{if(!R)return;R.speed=R.speed===1?3:R.speed===3?6:1;b.textContent='x'+R.speed;},dbgTime:()=>{if(R)R.time+=60;},dbgEnd:()=>{if(R)endRun(true);},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.disabled)return;const f=ACT[b.dataset.act];if(f){if(!['skill','summon'].includes(b.dataset.act))sfx('click');f(b.dataset.arg,b,e);}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#dcv').addEventListener('pointerdown',e=>{e.preventDefault();dungeonClick(e);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(R&&!R.ended){if(e.key==='1')useSkill(0);else if(e.key==='2')useSkill(1);else if(e.key==='a'||e.key==='A')ACT.toggleAuto();else if(e.key==='m'||e.key==='M')ACT.toggleMode();else if(e.key==='e'||e.key==='E')ACT.extract();}
 else if(e.key==='Escape'){if(!$('#confirm').classList.contains('hidden'))ACT.cNo();else closeModal();}});
window.addEventListener('resize',()=>{resizeWorkshop();if(R){resizeDungeon();updateHudButtons();}});
new ResizeObserver(()=>resizeWorkshop()).observe($('#wcv').parentElement);

/* ========================= LOOP ========================= */
let GT=0,lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;GT+=dt;
 try{if(R){if(!R.ended){const n=R.speed||1;for(let k=0;k<n;k++)runTick(dt);}if(R){renderDungeon();updateHud();}}else renderWorkshopCanvas(dt);
  if(summonAnim&&!$('#modal').classList.contains('hidden'))renderSummon(dt);}catch(err){console.error(err);}
 requestAnimationFrame(frame);}
load();curStats();renderWorkshop();resizeWorkshop();requestAnimationFrame(frame);
setInterval(()=>{if(!$('#modal').classList.contains('hidden'))return;renderQuests();},4000);
window.addEventListener('beforeunload',save);
// test hooks
window.__G={reset(){localStorage.removeItem(SAVE_KEY);S=newState();save();if(R)exitDungeon();closeModal();renderWorkshop();},get S(){return S},get R(){return R},calcStats,curStats,doEquip,doUnequip,doUpgrade,doDismantle,doCraft,doSummon,summonOne,startRun,runTick,endRun,useSkill,setTarget,chooseTarget,save,load,PART,TIERS,addPart:(pid)=>addPart(S,pid),upCost,genDungeon,DMAP,loadPreset,savePreset,ACT};
</script>
